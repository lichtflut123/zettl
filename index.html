// Kein Server, keine Anmeldung – einmal am Tag neu hochladen reicht.
const PREISDATEI = "preise.json";
let pdIndex = null, pdStand = null, pdLaden = null, pdFehler = null, pdGesamt = 0;

function pdUrl(){ return (S.shops && S.shops.file && S.shops.file.url) || PREISDATEI; }
function pdAn(){ return true; }   // immer versuchen; fehlt die Datei, passiert einfach nichts

async function ladePreisdatei(){
  if(pdIndex) return pdIndex;
  if(pdLaden) return pdLaden;
  pdLaden = (async () => {
    const res = await fetch(pdUrl(), { cache: "default" });
    if(!res.ok) throw new Error("HTTP " + res.status);
    const d = await res.json();
    pdStand = d.stand || null;
    // Gleiche Artikelnamen aus mehreren Läden zu einem Eintrag bündeln,
    // damit man den Preisvergleich auf einen Blick sieht
    const map = new Map();
    for(const a of (d.artikel || [])){
      const name = a[0], preis = a[1], laden = a[2], einheit = a[3], aktion = !!a[4];
      // Fremddaten: nur bekannte Warengruppen übernehmen, siehe katOk()
      const bio = !!a[5], regional = !!a[6], kat = katOk(a[7]);
      const key = norm(name) + "|" + (einheit || "");
      let e = map.get(key);
      if(!e){
        const n = norm(name);
        e = { name, unit: einheit, offer: aktion, bio, regional, cat: kat, n, w: n.split(" "), prices: [] };
        map.set(key, e);
      }
      if(aktion) e.offer = true;
      if(bio) e.bio = true;
      if(regional) e.regional = true;
      const da = e.prices.find(x => x.store === laden);
      if(!da) e.prices.push({ store: laden, price: preis, at: pdStand });
      else if(preis < da.price) da.price = preis;
    }
    const liste = [...map.values()];
    liste.forEach(e => e.prices.sort((x, y) => x.price - y.price));
    pdIndex = liste;
    return pdIndex;
  })();
  try { return await pdLaden; }
  catch(e){ pdFehler = (e && e.message) || String(e); pdIndex = []; return pdIndex; }
  finally { pdLaden = null; }
}

// Suche in der Preisdatei – dieselbe Logik wie im Server, nur am Handy
const PD_SYN = {
  klopapier:["toilettenpapier","klopapier"], erdaepfel:["erdaepfel","kartoffel"],
  kartoffel:["kartoffel","erdaepfel"], paradeiser:["paradeiser","tomate"],
  tomate:["tomate","paradeiser"], obers:["obers","sahne","rahm"],
  sahne:["sahne","obers","rahm"], schlagobers:["schlagobers","schlagrahm","sahne"],
  semmel:["semmel","broetchen","weckerl"], topfen:["topfen","quark"], quark:["quark","topfen"],
  faschiertes:["faschiertes","hackfleisch"], hackfleisch:["hackfleisch","faschiertes"],
  marille:["marille","aprikose"], karfiol:["karfiol","blumenkohl"],
  melanzani:["melanzani","aubergine"], germ:["germ","hefe"], kren:["kren","meerrettich"]
};
// Deutsche Komposita: das Grundwort steht hinten IM WORT und sagt, was die Sache ist.
// "Vollmilch" ist Milch, "Milchschokolade" ist Schokolade. Deshalb wiegt ein Treffer
// am Wortende schwer und einer am Wortanfang leicht. Die frühere Fassung hatte es
// genau umgekehrt (4 Punkte fürs Wortende, 18 fürs Wortanfang) und belohnte mit
// "Produkt steht meist hinten" zusätzlich die Wortstellung im Namen – also die
// Geschmacksrichtung: "Toblerone Milch" schlug jede Vollmilch.
const PD_W = {
  EXAKT: 100,   // der Artikel heißt genau so
  WORT:   80,   // eigenständiges Wort:            "S-BUDGET Butter"
  KOPF:   72,   // Wortende, Grundwort:            "vollMILCH", "alpenBUTTER"
  BEST:   16,   // Wortanfang, Bestimmungswort:    "MILCHschokolade"
  MITTE:   5,   // mitten im Wort
  POS:     8,   // hinten im Namen, nur noch ein schwacher Hinweis
  ZEICHEN:30,   // Zeichenabdeckung – kurze, generische Namen bevorzugen
  WORTE:  12,   // Wortabdeckung
  BEI:     4, BEIMAX: 20,   // Abzug je überzähligem Beiwort
  KAT:    40,   // Abzug bei fremder Warengruppe aus dem Datensatz
  KAT2:   25,   // Abzug, wenn der Name eine andere Warengruppe nahelegt
  SYN:    18    // Abzug für Synonyme – das getippte Wort selbst gewinnt
};
// Abgewertet wird nur, wenn die Warengruppe des SUCHWORTS sicher ist. guessCat
// sucht Teilzeichenketten: "Paradeiser" enthält "eis" und gälte als Tiefkühl,
// "Preiselbeeren" enthält "reis" und gälte als Vorrat. Ein Abzug auf dieser
// Grundlage bestraft ausgerechnet die Artikel, die richtig einsortiert sind –
// gemessen fiel "Ja! Natürlich Bio Paradeiser" damit von Platz 1 auf Platz 20.
// Deshalb hier nur ganze Wörter, und im Zweifel "sonst": dann wirkt gar kein Abzug.
function katFuerSuche(q){
  const worte = norm(q).split(" ").filter(Boolean);
  let cat = "sonst", score = 0;
  for(const [c, words] of CAT_WORDS_N) for(const w of words){
    const ww = w.trim();
    if(!worte.some(t => t === ww)) continue;
    if(ww.length*2 > score){ score = ww.length*2; cat = c; }
  }
  return cat;
}
function pdSuche(q, max){
  if(!pdIndex || !pdIndex.length) return [];
  const roh = norm(q).split(" ").filter(Boolean);
  if(!roh.length) return [];
  // Synonyme sind ein Ersatz, kein Gleichrangiges. "Paradeiser" steht in neun
  // Artikeln, das Synonym "Tomate" in 222 – ohne Abzug erschlagen die Tomaten-
  // produkte die echten Paradeiser. Wo das getippte Wort selbst vorkommt, gewinnt es.
  const gruppen = roh.map(w => ({ orig: w, worte: PD_SYN[w] ? PD_SYN[w].map(norm) : [w] }));
  const katQ = katFuerSuche(q);
  const treffer = [];
  for(const e of pdIndex){
    const k = e.w.length;
    let s = 0, abdeckung = 0, worte = 0, ok = true;
    for(const gruppe of gruppen){
      let best = -1, len = 0;
      for(const w of gruppe.worte){
        const abzug = (w === gruppe.orig) ? 0 : PD_W.SYN;
        if(e.n.indexOf(w) < 0) continue;               // Vorfilter wie bisher
        if(e.n === w){
          const p = PD_W.EXAKT + PD_W.POS - abzug;
          if(p > best){ best = p; len = w.length; }
          continue;
        }
        for(let i = 0; i < k; i++){
          const t = e.w[i], j = t.indexOf(w);
          if(j < 0) continue;
          let art;
          if(t === w) art = PD_W.WORT;
          // Wortende zählt erst ab vier Zeichen als Grundwort, sonst hängt
          // "eier" in "rostfreier" und "ei" in jedem "…rei"
          else if(j + w.length === t.length) art = (w.length >= 4 ? PD_W.KOPF : PD_W.MITTE);
          else if(j === 0) art = PD_W.BEST;
          else art = PD_W.MITTE;
          const p = art + Math.round(PD_W.POS * (k > 1 ? i/(k-1) : 1)) - abzug;
          if(p > best){ best = p; len = w.length; }
        }
      }
      if(best < 0){ ok = false; break; }
      s += best; abdeckung += len; worte++;
    }
    if(!ok) continue;
    s += Math.round(PD_W.ZEICHEN * Math.min(1, abdeckung / Math.max(e.n.length, 1)));
    s += Math.round(PD_W.WORTE * Math.min(1, worte / Math.max(k, 1)));
    s -= Math.min(PD_W.BEIMAX, PD_W.BEI * Math.max(0, k - worte - 1));
    // Warengruppe: nur abwerten, nie belohnen. Hofer liefert für keinen einzigen
    // Artikel eine – ein Bonus für die anderen würde den Diskonter bestrafen.
    if(katQ !== "sonst"){
      if(e.cat && e.cat !== katQ) s -= PD_W.KAT;
      else {
        // Zweite Meinung aus dem Namen. "Milka Schokoladen Milch" ist im Datensatz
        // als Kühlregal geführt, ist aber Schokolade – dagegen hilft die Warengruppe
        // nicht. Nur für Artikel gerechnet, die den Vorfilter passiert haben, und
        // je Artikel nur einmal: über alle 51.000 wäre es zu teuer.
        if(e.gcat === undefined) e.gcat = guessCat(e.name);
        if(e.gcat !== "sonst" && e.gcat !== katQ) s -= PD_W.KAT2;
      }
    }
    if(e.offer) s += 6;
    // Was euch wichtig ist, kommt weiter nach oben
    if(S.pref.bio && e.bio) s += 25;
    if(S.pref.regional && e.regional) s += 25;
    treffer.push({ e, s });
  }
  treffer.sort((a, b) => (b.s - a.s) || (a.e.prices[0].price - b.e.prices[0].price));
  pdGesamt = treffer.length;
  return treffer.slice(0, max || 20).map(t => ({
    id: t.e.n, name: t.e.name, brand: null, unit: t.e.unit, image: null,
    offer: t.e.offer, bio: t.e.bio, regional: t.e.regional, cat: t.e.cat,
    best: t.e.prices[0], prices: t.e.prices
  }));
}

async function findPlace(query){
  const q = String(query||"").trim();
  if(q.length < 3) throw new Error("Bitte mindestens drei Buchstaben eingeben.");
  const url = "https://nominatim.openstreetmap.org/search?format=json&limit=5&accept-language=de&q="
            + encodeURIComponent(q);
  const res = await fetch(url, { headers: { "Accept":"application/json" } });
  if(!res.ok) throw new Error("HTTP "+res.status);

  return (data||[]).map(d => ({

// Supermärkte im Umkreis über OpenStreetMap (frei nutzbar, keine Anmeldung).
// Der Dienst ist öffentlich und manchmal überlastet – deshalb mehrere Server.
const OVERPASS_SERVER = [
  "https://overpass-api.de/api/interpreter",
  "https://overpass.kumi.systems/api/interpreter",
  "https://overpass.osm.ch/api/interpreter"
];
async function overpassQuery(q){
  let letzter = null;
  for(const url of OVERPASS_SERVER){
    try{
      const res = await fetch(url, { method:"POST", headers:{"Content-Type":"text/plain"}, body:q });
      if(res.ok) return await res.json();
      letzter = new Error("HTTP "+res.status);
      if(res.status === 400) break;             // an der Anfrage liegt's, Serverwechsel hilft nicht
    }catch(e){ letzter = e; }
  }
  throw letzter || new Error("Kartendienst nicht erreichbar");
}
// Übersetzt technische Fehler in etwas, mit dem man etwas anfangen kann
function kartenFehler(e){
  const m = String((e && e.message) || e);
  if(/50[234]|timeout|Timeout/.test(m))
    return "Der Kartendienst ist gerade überlastet. In ein paar Minuten nochmal versuchen – oder die Läden unten von Hand eintragen.";
  if(/429/.test(m))
    return "Zu viele Anfragen an den Kartendienst. Kurz warten und nochmal versuchen.";
  if(/Failed to fetch|NetworkError|Load failed/i.test(m))
    return "Keine Verbindung zum Kartendienst. Internet prüfen und nochmal versuchen.";
  return "Suche fehlgeschlagen ("+m+"). Du kannst die Läden unten auch von Hand eintragen.";
}
async function findShops(home, radiusM){
  const r = radiusM || 3000;
  const q = '[out:json][timeout:20];'
    + 'nwr["shop"~"^(supermarket|convenience|chemist|greengrocer|bakery|butcher|beverages)$"]'
    + '(around:'+r+','+home.lat+','+home.lon+');out center tags 60;';
  const data = await overpassQuery(q);
  const out = [];
  (data.elements||[]).forEach(el => {
    const t = el.tags||{};
    const name = t.name || t.brand || t.operator;
    if(!name) return;
    const lat = el.lat!=null?el.lat:(el.center&&el.center.lat), lon = el.lon!=null?el.lon:(el.center&&el.center.lon);
    if(lat==null||lon==null) return;
    const d = distKm(home, {lat, lon});
    const same = out.find(o => norm(o.name)===norm(name) && Math.abs(o.dist-d) < 0.15);
    if(same) return;
    out.push({ name:String(name).trim(), brand:t.brand||null, shop:t.shop||null, lat, lon, dist:d });
  });
  out.sort((a,b) => a.dist-b.dist);
  return out.slice(0, 30);
}

async function doConnect(url, key){
  S.connectErr=null; S.connectBusy=true; render();
  const cfg = { url: apiBase(url), key: String(key||"").trim() };
  if(!cfg.url || !cfg.key){ S.connectBusy=false; S.connectErr="Bitte beide Felder ausfüllen."; render(); return; }
  lsSet(LS.sync, cfg); S.sync=cfg;
  try{
    const rv = await remoteGet("vault");
    S.connectBusy=false;
    if(!rv){ S.connectErr="Verbunden, aber dort liegt noch kein Haushalt. Leg ihn zuerst am anderen Handy an."; render(); return; }
    lsSet(LS.vault, rv); S.vault=rv; e2eJemals=true;
    S.phase="unlock"; render();
  }catch(e){
    S.connectBusy=false;
    const m = String(e && e.message || e);
    S.connectErr = /404/.test(m) ? "Tabelle nicht gefunden – wurde das SQL im Datenbank-Projekt ausgeführt?"
      : /401|403/.test(m) ? "Der Schlüssel passt nicht. Nimm den publishable bzw. anon-Key."
      : "Keine Verbindung: "+m;
    render();
  }
}

// Rät den Raumtyp aus dem Namen, damit die Vorschläge sofort passen
function guessType(name){
  // ohneUmlaut, nicht norm: die Regeln unten führen die Schreibweisen ohne Umlaut
  // ohnehin schon mit ("waschkuch", "kuch", "sanitar"), und nach der Faltung
  // träfe "waschküch" das gefaltete "waschkueche" nicht mehr.
  const n = ohneUmlaut(name);
  const rules = [
    [/waschkuch|waschküch|waschraum|waschk/, "wasch"],      // vor "Küche"!
    [/heiz|technikr|boiler|kessel/, "heizraum"],
    [/werkstatt|hobbyr|bastel/, "werkstatt"],
    [/garage|carport|stellplatz/, "garage"],
    [/dachbod|speicher|estrich/, "dachboden"],
    [/keller|lager/, "keller"],
    [/abstell|speis|vorrats|kammer/, "abstell"],
    [/sauna|wellness|dampfb/, "sauna"],
    [/pool|schwimmb|becken/, "pool"],
    [/balkon|terrass|loggia|veranda/, "balkon"],
    [/garten|hof|beet|gewachsh|gewächsh/, "garten"],
    [/kuch|küch|kitchen/, "kueche"],
    [/esszimm|essb|essecke|speisez/, "essen"],
    [/wc|klo\b|toilet/, "wc"],                              // vor "Gäste": Gäste-WC!
    [/g(a|ä)stez|g(a|ä)stebett|g(a|ä)steb/, "gaeste"],
    [/ankleide|garderobenz|kleiderk|walk.?in/, "ankleide"],
    [/kinder|baby|spielz|jugendz/, "kind"],

    [/bad|dusch|sanitar|sanitär/, "bad"],
    [/schlaf|bedroom|elternz/, "schlafen"],
    [/buro|büro|office|arbeitsz|studio/, "buero"],
    [/stiege|treppe|stock|podest/, "stiege"],
    [/flur|diele|eingang|vorraum|gang|windfang/, "flur"],
    [/wohnz|wohnr|living|salon|kaminz/, "wohnen"],
    [/katz|hund|tier|haustier|vogel|nager/, "tier"],
    [/auto|wagen|pkw|fahrzeug/, "auto"]
  ];
  for(const [re, t] of rules) if(re.test(n)) return t;
  return "allgemein";
}

function viewSig(){
  const sum = (a) => (a||[]).reduce((x,i)=>x+(i.updatedAt||0)+(i.done?1:0)+(i.doneAt?2:0),0);
  // Das Kaufgedächtnis muss mit hinein: "Zuletzt gekauft", die Kostenkarte und die
  // Preis-Zusätze an den Zeilen leben davon. Ein Sync, der nur Preise bringt, hat
  // sonst keinen Ausweis und zeichnet nicht neu. Und today(), weil die Fälligkeit
  // am Datum hängt – sonst steht bei über Mitternacht offener App der Stand von gestern.
  const preise = (p) => { let n=0, u=0; for(const k in (p||{})){ n++; u += (p[k] && p[k].updatedAt) || 0; } return n+":"+u; };
  // S.syncMsg gehört dazu: bleibt der Zustand "error" und ändert sich nur der
  // Grund – erst "Failed to fetch" im Funkloch, später "HTTP 401" nach einem
  // Schlüsselwechsel –, zeichnete die stille Runde sonst nie neu und im Banner
  // stand weiter der alte, falsche Grund.
  return [S.phase, S.tab, S.modal, S.modalBack, S.floor, S.syncState, S.syncMsg, S.err, S.toast, S.sortByStore, S.draft.cat,
    preise(S.prices), today(),

    S.taskId, Object.keys(S.prodSel).filter(k=>S.prodSel[k]).join(","),

// Sanftes Neuzeichnen für Hintergrund-Aufgaben: lässt offene Dialoge und
// Eingaben in Ruhe und macht nichts, wenn sich nichts geändert hat.
function renderQuiet(){
  if(S.modal || S.draft.taskOpen) return;      // niemals mitten in eine Eingabe grätschen
  if(viewSig() === lastSig) return;            // nichts Neues -> nichts anfassen

function render(){
  // Die Seite kann zwischendurch geschlossen worden sein (Tab zu, App beendet),
  // während noch ein Speichervorgang lief – dann gibt es nichts mehr zu zeichnen.
  if(typeof document === "undefined" || !document || !document.querySelector) return;
  const app = $("#app");
  if(!app) return;
  const y = (typeof window!=="undefined" && window.scrollY) || 0;
  lastSig = viewSig();
  if(S.phase==="loading"){ app.innerHTML = viewLoading(); return; }
  if(S.phase==="welcome"){ app.innerHTML = viewWelcome(); wireWelcome(); return; }
  if(S.phase==="connect"){ app.innerHTML = viewConnect(); wireConnect(); return; }
  if(S.phase==="setup"){ app.innerHTML = viewSetup(); wireSetup(); return; }
  if(S.phase==="unlock"){ app.innerHTML = viewUnlock(); wireUnlock(); return; }
  if(S.phase==="choose"){ app.innerHTML = viewChoose(); wireChoose(); return; }
  app.innerHTML = viewMain(); wireMain();
  // Passt die Beschriftung nicht in den Reiter, läuft sie langsam durch
  try{
    document.querySelectorAll(".tabs button > span").forEach(sp => {
      const platz = sp.parentNode.clientWidth - 16, breite = sp.scrollWidth;
      sp.classList.remove("lauf");
      if(breite > platz + 2 && platz > 0){
        sp.style.setProperty("--weg", -(breite - platz + 4) + "px");
        sp.classList.add("lauf");
      } else sp.style.removeProperty("--weg");
    });
  }catch(e){}

  // Die untere Leiste wächst mit ihrem Inhalt – die Liste muss entsprechend
  // Platz lassen, sonst verschwinden die letzten Einträge dahinter.
  try{
    const dock = document.querySelector(".dock"), liste = document.querySelector(".list");
    if(dock && liste){
      const hoehe = dock.getBoundingClientRect().height;
      liste.style.paddingBottom = (hoehe > 40 ? Math.round(hoehe) + 24 : 170) + "px";
    }
  }catch(e){}
  if(y) { try{ window.scrollTo(0, y); }catch(e){} }
}

function basketCard(){
  const a = basketAnalysis();
  if(!a.known) return "";
  const parts = a.stores.slice(0,3).map(s => esc(s)+" "+esc(euro(a.perStore[s])));
  const twoStores = a.stores.length > 1;
  const biggest = a.stores[0];
  const rest = a.sum - (a.perStore[biggest]||0);
  return '<div class="basket">'
   + '<div class="row" style="justify-content:space-between">'
     + '<span><b>'+esc(euro(a.sum))+'</b> <span style="color:var(--soft)">für '+a.known+' von '+a.count+' Artikeln</span></span>'
     + '<button class="link" id="priceHelp">Preise</button>'
   + '</div>'
   + (parts.length ? '<div class="muted" style="margin-top:4px">'+parts.join(" · ")+'</div>' : '')
   + (a.stores.map(s=>shopByName(s)).filter(s=>s&&s.dist!=null).length
      ? '<div class="muted" style="margin-top:2px">'
        + a.stores.map(s=>{const sh=shopByName(s); return sh&&sh.dist!=null ? esc(s)+" "+esc(String(sh.dist).replace(".",","))+" km" : null;})
            .filter(Boolean).join(" · ")+'</div>' : '')
   + (twoStores && rest > 0
      // "bringt" las sich wie eine Ersparnis. Der Betrag ist aber das, was im
      // zweiten Laden liegt – also der Grund für den Weg, nicht der Gewinn.
      ? '<div class="muted" style="margin-top:4px">Davon liegen '+esc(euro(rest))+' '
        + (a.stores.length===2 ? 'bei '+esc(a.stores[1]) : 'in anderen Läden')

function secHead(o){

  return '<div class="sec">'
   + '<button class="foldbtn" data-fold="'+esc(o.key)+'">'

const istZu = (key) => !!(S.zu && S.zu[key]);

// Der Aufklappzustand liegt unverschlüsselt in localStorage – er wird schon
// gebraucht, bevor der Haushalt entsperrt ist. Deshalb darf im Schlüssel kein
// Raumname stehen: "r:Omas Zimmer" verriet die ganze Raumaufteilung an jeden,
// der das gesperrte Handy in die Hand bekommt, während dieselben Namen im
// Datensatz "rooms" aufwändig verschlüsselt werden. Die Raum-ID ist ein uid()
// und sagt nichts; für Aufgaben, deren Raum es nicht mehr gibt, bleibt eine
// Zahl. Die alten "r:"-Schlüssel räumt boot() einmalig weg.
function kurzHash(s){
  let h = 2166136261;
  const t = String(s||"");
  for(let i=0;i<t.length;i++){ h ^= t.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0).toString(36);
}
const foldKey = (room, rObj) => (rObj && rObj.id) ? "rid:"+rObj.id : "rn:"+kurzHash(room);

function badge(due){
  const d = dayDiff(due); if(d==null) return "";
  if(d<0)  return '<span class="badge over">'+(-d)+' T. drüber</span>';
  if(d===0) return '<span class="badge today">heute</span>';
  if(d===1) return '<span class="badge">morgen</span>';
  return '<span class="badge">in '+d+' T.</span>';
}
function taskRow(t){
  const m=memberById(t.by), last = t.lastDone ? memberById(t.lastDone.by) : null;
  const prods = productsForTask(t.title).length;
  return '<div class="item"><span class="bar '+(m?m.color:"")+'"></span>'

   + '<span class="meta">'+(t.repeat?"↻ "+t.repeat+" T.":"")
     + (last? (t.repeat?" · ":"")+"zuletzt "+esc(last.name) : "")
     + (t.skips ? ((t.repeat||last)?" · ":"")+t.skips+"× ausgelassen" : "")+'</span></button>'
   + badge(t.due)
   + '<button class="x" data-del="'+t.id+'" aria-label="Löschen">✕</button></div>';

function listTasks(){
  const items = visible(S.tasks);
  const open = items.filter(t=>!t.doneAt), done = items.filter(t=>t.doneAt).slice(-8).reverse();
  const byRoom = {};
  open.forEach(t => { const r=t.room||"Allgemein"; (byRoom[r]=byRoom[r]||[]).push(t); });
  const names = visible(S.rooms).map(r=>r.name);
  const placeNames = visible(S.rooms).filter(isPlace).map(r=>r.name);
  // Aufgaben ohne festen Ort (Sammelstellen und verwaiste Räume) stehen für sich
  const general = Object.keys(byRoom).filter(r => placeNames.indexOf(r) < 0);
  let order = placeNames.filter(r=>byRoom[r]);

  // Geschoss-Leiste, sobald sich die Räume auf mehrere Ebenen verteilen
  // Alle Geschosse zeigen, in denen es Räume gibt – auch wenn dort gerade
  // nichts offen ist. Sonst verschwindet ein frisch angelegter Stock wieder.
  const floors = usedFloors(visible(S.rooms).filter(isPlace));
  let bar = "";
  if(floors.length > 1){
    if(S.floor && floors.indexOf(S.floor)<0) S.floor = null;
    bar = '<div class="floorbar"><button class="chip'+(!S.floor?" on":"")+'" data-floor="">Alle</button>'
        + floors.map(f=>'<button class="chip'+(S.floor===f?" on":"")+'" data-floor="'+esc(f)+'">'+esc(f)+'</button>').join("")
        + '</div>';
    if(S.floor) order = order.filter(n => { const r=roomByName(n); return r && roomFloor(r)===S.floor; });
  }
  let h = bar;

  // Grundriss zeigen, sobald einer angelegt wurde – man sieht sofort, wo etwas ansteht
  const allFloors = usedFloors(visible(S.rooms));
  const miniFloor = S.floor || floors[0] || allFloors[0] || null;
  if(miniFloor && hasPlan(miniFloor)) h += planCanvas(miniFloor, true);

  if(!items.length) return h + '<div class="empty"><b>Keine Aufgaben.</b><span>Leg unten eine an – z. B. Müll rausbringen, alle 3 Tage.</span></div>';

  // Direkt unter dem Plan: alles, was zu keinem Raum gehört
  general.forEach(room => {
    byRoom[room].sort((a,b)=>String(a.due||"9999").localeCompare(String(b.due||"9999")));
    const rObj = roomByName(room);
    h += secHead({ key:foldKey(room, rObj), icon:roomIcon(rObj?rObj.type:"allgemein",16), name:room,
                   zusatz:'· ohne Raum', anzahl:byRoom[room].length,
                   extra:(rObj ? '<button class="link" data-tips="'+rObj.id+'">Vorschläge</button>' : '') });
    if(!istZu(foldKey(room, rObj))) h += byRoom[room].map(taskRow).join("");
  });

  if(!order.length && !general.length) h += '<div class="empty"><b>Hier ist nichts offen.</b><span>In diesem Geschoss gibt es gerade keine Aufgaben.</span></div>';
  order.forEach(room => {
    byRoom[room].sort((a,b)=>String(a.due||"9999").localeCompare(String(b.due||"9999")));
    const rObj = roomByName(room);
    const faellig = byRoom[room].filter(t => t.due && dayDiff(t.due) <= 0).length;
    h += secHead({ key:foldKey(room, rObj), icon:roomIcon(rObj?rObj.type:"allgemein",16), name:room,
                   zusatz:(rObj && !S.floor && floors.length>1 ? '· '+esc(roomFloor(rObj)) : ''),
                   anzahl:byRoom[room].length + (faellig ? " · "+faellig+" fällig" : ""),
                   extra:(rObj ? '<button class="link" data-tips="'+rObj.id+'">Vorschläge</button>' : '') });
    if(!istZu(foldKey(room, rObj))) h += byRoom[room].map(taskRow).join("");
  });
  if(done.length){
    h += secHead({ key:"r:erledigt", name:"Erledigt", anzahl:done.length });
    if(!istZu("r:erledigt")) h += done.map(t => { const w=memberById(t.doneBy);
      return '<div class="row" style="padding:6px 12px;color:var(--soft);font-size:14px"><span>✓</span>'
       + '<span class="grow" style="text-decoration:line-through">'+esc(t.title)+'</span>'
       + '<span style="font-size:12px">'+fmtDate(t.doneAt)+(w?" · "+esc(w.name):"")+'</span></div>'; }).join("");
  }
  return h;
}

// Die drei Karten unter dem Rechnen-Knopf: je Variante Posten, Summe,
// Ladenaufteilung und die ehrlichen Lücken (Entscheidung 8).
function wagerlKarten(){
  const namen = { guenstig:"Die günstigste", regional:"Die regionale", bio:"Die Bio-Variante" };
  const flagText = { regional:"nichts Regionales bekannt", bio:"nichts in Bio bekannt" };
  let h = "";
  for(const k of ["guenstig","regional","bio"]){
    const wv = S.wagerl[k]; if(!wv) continue;
    const zeilen = wv.posten.map(p => {
      if(!p.produkt)
        return '<div class="muted" style="margin-top:4px">'+esc(p.begriff)+' – nichts im Datensatz gefunden, bleibt wie getippt</div>';
      const pr = p.produkt;
      return '<div style="margin-top:4px;display:flex;justify-content:space-between;gap:8px">'
        + '<span>'+(pr.n>1 ? pr.n+' × ' : '')+esc(pr.name)+(pr.unit ? ' <span style="opacity:.6">('+esc(pr.unit)+')</span>' : '')
        + (pr.ohneMenge ? ' <span style="opacity:.6">· Menge offen, 1 Packung angenommen</span>' : '')
        + (p.luecke && flagText[p.luecke] ? ' <span style="opacity:.6">· '+flagText[p.luecke]+'</span>' : '')
        + '</span><span style="flex:0 0 auto">'+esc(pr.laden)+' · '+esc(euro(pr.kosten))+'</span></div>';
    }).join("");
    const laeden = Object.keys(wv.laeden).sort((a,b)=>wv.laeden[b]-wv.laeden[a])
      .map(l => wv.laeden[l]+" bei "+esc(l)).join(", ");
    h += '<div class="note" data-wagerl="'+k+'" style="margin-top:12px">'
      + '<div style="display:flex;justify-content:space-between;gap:8px"><b>'+namen[k]+'</b>'
      + '<b>'+esc(euro(wv.summe))+(wv.offen ? ' <span style="opacity:.6;font-weight:400">· '+wv.offen+' Position'+(wv.offen>1?'en':'')+' offen</span>' : '')+'</b></div>'
      + (laeden ? '<div class="muted" style="margin-top:2px">'+laeden+'</div>' : '')
      + (wv.luecken ? '<div class="muted" style="margin-top:2px">Lücke: für '+wv.luecken+' von '+wv.posten.length+' Positionen ist '
          + (k==="bio" ? 'nichts in Bio' : 'nichts Regionales')+' bekannt.</div>' : '')
      // Entscheidung 9: Hofer steht nur mit einem Bruchteil des Sortiments im
      // Datensatz. Kauft die Karte dort, gehört die Einschränkung dazu – sonst
      // klingt "die günstigste" vollständiger, als der Datensatz es hergibt.
      + (wv.laeden["Hofer"] ? '<div class="muted" style="margin-top:2px">Hofer ist im Datensatz nur teilweise erfasst – dort kann es mehr geben.</div>' : '')
      + zeilen
      + '<button class="btn ghost" data-wagerl-nehmen="'+k+'" style="margin-top:10px">Dieses Wagerl nehmen</button>'
      + '</div>';
  }
  return h;
}

function wireShoppingBar(){
  const what=$("#what"), add=$("#addItem");
  if(!what) return;
  const cb=$("#closeBar"); if(cb) cb.onclick = () => {
    S.draft = { price:"", store:null, cat:null, showPrice:false, taskOpen:false, name:"", room:S.draft.room, rep:0, title:"" };
    S.prodHits=null; S.prodHitsQ=null; S.mehrTreffer=false;
    const f=$("#what"); if(f){ f.value=""; f.blur(); }
    render();
  };
  // Produktsuche beim Tippen, entspannt verzögert
  const startSuche = (q) => {
    if(q.length < 3){ if(S.prodHits){ S.prodHits=null; S.prodHitsQ=null; } return; }
    clearTimeout(window.__zsucheTimer);
    window.__zsucheTimer = setTimeout(async () => {
      try{
        let treffer = [];
        if(srvOn()) treffer = await srvSearch(q);          // eigener Server, falls vorhanden
        else { await ladePreisdatei(); treffer = pdSuche(q, S.mehrTreffer ? 60 : 20); }
        if(norm(($("#what")||{}).value||"") !== norm(q)) return;   // schon weitergetippt
        S.prodHits = treffer; S.prodHitsQ = norm(q); S.prodBusy=false;
        render();
        const f=$("#what"); if(f){ f.focus(); f.setSelectionRange(f.value.length,f.value.length); }
      }catch(e){ S.prodHits=null; S.prodHitsQ=null; S.prodBusy=false; }
    }, 400);
  };
  what.oninput = () => {
    const before = S.draft.name.trim();
    const after = what.value.trim();
    const panelBefore = before.length>=2, panelAfter = after.length>=2;
    const memBefore = !!(before.length>1 && bestPrice(before));
    const memAfter  = !!(after.length>1 && bestPrice(after));
    const catBefore = before.length>=2 ? guessCat(before) : null;
    const catAfter  = after.length>=2 ? guessCat(after) : null;
    S.draft.name = what.value;
    add.classList.toggle("off", !after);
    if(before !== after) S.mehrTreffer = false;   // neue Eingabe, wieder kurze Liste
    startSuche(after);
    if(panelBefore!==panelAfter || memBefore!==memAfter || (!S.draft.cat && catBefore!==catAfter)){
      render();
      const w=$("#what"); if(w){ w.focus(); w.setSelectionRange(w.value.length, w.value.length); }
    }
  };
  what.onkeydown = e => { if(e.key==="Enter") add.click(); };
  const pr=$("#price"); if(pr) pr.oninput = () => { S.draft.price = pr.value; };
  document.querySelectorAll("[data-store]").forEach(b => b.onclick = () => {
    const s=b.getAttribute("data-store"); S.draft.store = (S.draft.store===s?null:s); render(); });
  const mt=$("#mehrTreffer"); if(mt) mt.onclick = async () => {
    S.mehrTreffer = true;
    const q = (S.draft.name||"").trim();
    if(srvOn()) S.prodHits = await srvSearch(q); else S.prodHits = pdSuche(q, 60);
    render();
    const f=$("#what"); if(f){ f.focus(); f.setSelectionRange(f.value.length, f.value.length); }
  };

  document.querySelectorAll("[data-hit]").forEach(b => b.onclick = async () => {
    const p = (S.prodHits||[])[parseInt(b.getAttribute("data-hit"),10)];
    if(!p) return;
    const name = p.name + (p.unit ? " ("+p.unit+")" : "");
    const item = { id:uid(), name, price:p.best?p.best.price:null, store:p.best?p.best.store:null,
                   cat:p.cat||guessCat(p.name), bio:!!p.bio, regional:!!p.regional, size:p.unit||null,
                   by:S.meId, done:false, at:today(), updatedAt:now() };
    S.draft = { price:"", store:null, cat:null, showPrice:false, taskOpen:false, name:"", room:S.draft.room, rep:0, title:"" };
    S.prodHits=null; S.prodHitsQ=null;
    const f=$("#what"); if(f) f.value="";
    await updateItems("shopping", list => list.concat([item]));
    // Nur frische Preise ins Gedächtnis – sonst merkt sich die App Preise von 2023
    if(p.best && (!p.best.at || daysBetween(p.best.at, today()) < 60)) rememberPrice(name, p.best.price, p.best.store);
  });
  // Zuletzt gekauft: der normalisierte Name steht im Attribut, nicht der Listenindex –
  // sonst zeigt ein Tipp nach einem Sync dazwischen auf den falschen Artikel.
  document.querySelectorAll("[data-zuletzt]").forEach(b => {
    const key = b.getAttribute("data-zuletzt");
    const nameVon = () => { const e = normPriceEntry(S.prices[key]); return (e && e.lastName) || key; };
    // Langes Drücken vergisst den Eintrag, ein kurzer Tipp setzt ihn auf die Liste.
    let timer = null, lang = false;
    const los = () => {
      if(timer) return;                       // pointerdown und mousedown feuern beide
      lang = false;
      timer = setTimeout(async () => {
        timer = null; lang = true;
        await vergessen(nameVon());
        toast("Aus dem Verlauf entfernt");
      }, 550);
    };
    const weg = () => { if(timer){ clearTimeout(timer); timer = null; } };
    ["pointerdown","mousedown","touchstart"].forEach(ev => b.addEventListener(ev, los));
    ["pointerup","pointercancel","pointerleave","mouseup","mouseleave","touchend","touchcancel","touchmove"]
      .forEach(ev => b.addEventListener(ev, weg));
    b.onclick = async () => {
      if(lang){ lang = false; return; }       // war ein langes Drücken, kein Antippen
      // Erst prüfen, dann sperren – sonst bleibt der Knopf bei einem frühen Ausstieg tot
      if(zuletztBusy.has(key)) return;
      if(visible(S.shopping).some(i => norm(i.name) === key)) return;   // steht schon drauf
      zuletztBusy.add(key);
      try { await addProductsToList([nameVon()]); }
      finally { zuletztBusy.delete(key); render(); }
    };
  });
  document.querySelectorAll("[data-cat]").forEach(b => b.onclick = () => {
    S.draft.cat = b.getAttribute("data-cat"); render(); });

  const um=$("#useMem"); if(um) um.onclick = () => {
    const b2 = bestPrice(S.draft.name);
    if(b2){ S.draft.price = b2.price!=null?String(b2.price).replace(".",","):""; S.draft.store=b2.store||null; render(); } };
  let addBusy = false;
  add.onclick = async () => {
    const n = (what.value||"").trim();
    if(!n || addBusy) return;
    addBusy = true;
    what.value = "";                 // sofort leeren: ein zweiter Tipp läuft ins Leere
    const price = parseEuro(S.draft.price);
    const store = S.draft.store;
    const item = { id:uid(), name:n, price, store, cat:(S.draft.cat||katFuer(n)), by:S.meId, done:false, at:today(), updatedAt:now() };
    S.draft = { price:"", store:null, cat:null, showPrice:false, taskOpen:false, name:"", room:S.draft.room, rep:0, title:"" };
    await updateItems("shopping", list => list.concat([item]));
    if(price!=null || store) rememberPrice(n, price, store);
    addBusy = false;
    const w=$("#what"); if(w) w.focus();
  };
}

function wirePlan(){
  document.querySelectorAll("[data-pfloor]").forEach(b => b.onclick = () => {
    S.planFloor = b.getAttribute("data-pfloor"); render(); });
  const pe=$("#planEdit"); if(pe) pe.onclick = () => { S.planEdit = !S.planEdit; render(); };
  const par=$("#planAddRoom"); if(par) par.onclick = () => {
    S.roomPrefillFloor = S.planFloor; S.modal="room"; render(); };
  const ps=$("#planSketch"), pf=$("#sketchFile");
  if(ps && pf){
    ps.onclick = () => {
      if((S.plan.bg||{})[S.planFloor]){
        if(confirm("Skizze für "+S.planFloor+" entfernen?")) { savePlanBg(S.planFloor, null); return; }
        return;
      }
      pf.click();
    };
    pf.onchange = () => {
      const f = pf.files && pf.files[0]; if(!f) return;
      toast("Skizze wird geladen …");
      shrinkImage(f, (data) => { if(data) savePlanBg(S.planFloor, data); });
    };
  }

  const cv = $("#canvas"); if(!cv) return;

  if(!S.planEdit){
    document.querySelectorAll("[data-rid]").forEach(el => el.onclick = () => {
      S.planRoom = el.getAttribute("data-rid"); S.modal="roomtasks"; render(); });
    return;
  }

  // Ziehen und Größe ändern – funktioniert mit Finger und Maus
  let drag = null;
  const point = (e) => {
    const t = (e.touches && e.touches[0]) || (e.changedTouches && e.changedTouches[0]) || e;
    return { x: t.clientX, y: t.clientY };
  };
  const start = (e) => {
    const handle = e.target.closest && e.target.closest("[data-resize]");
    const box = e.target.closest && e.target.closest("[data-rid]");
    if(!box) return;
    const id = box.getAttribute("data-rid");
    // layoutFloor zuerst: es vergibt Rasterplätze für Räume, die noch nie von Hand
    // gesetzt wurden. S.rooms.find trifft zwar immer, aber mit x/y undefined –
    // dann rechnet das Ziehen mit NaN und der Raum lässt sich nie positionieren.
    const room = layoutFloor(S.planFloor).find(r => r.id===id) || S.rooms.find(r => r.id===id);
    if(!room) return;
    const rect = cv.getBoundingClientRect();
    drag = { id, box, mode: handle ? "size" : "move", p: point(e), rect,
             x0: room.x, y0: room.y, w0: room.w, h0: room.h };
    if(e.preventDefault) e.preventDefault();
  };
  const move = (e) => {
    if(!drag) return;
    const p = point(e);
    const dx = (p.x - drag.p.x) / drag.rect.width * GRID;
    const dy = (p.y - drag.p.y) / drag.rect.height * GRID;
    let x=drag.x0, y=drag.y0, w=drag.w0, h=drag.h0;
    if(drag.mode==="move"){ x = Math.max(0, Math.min(GRID-w, drag.x0+dx)); y = Math.max(0, Math.min(GRID-h, drag.y0+dy)); }
    else { w = Math.max(3, Math.min(GRID-drag.x0, drag.w0+dx)); h = Math.max(2.5, Math.min(GRID-drag.y0, drag.h0+dy)); }
    drag.last = {x,y,w,h};
    drag.box.style.left = (x/GRID*100)+"%"; drag.box.style.top = (y/GRID*100)+"%";
    drag.box.style.width = (w/GRID*100)+"%"; drag.box.style.height = (h/GRID*100)+"%";
    if(e.preventDefault) e.preventDefault();
  };
  const end = async () => {
    if(!drag) return;
    const d = drag; drag = null;
    if(d.last) await setRoomRect(d.id, d.last.x, d.last.y, d.last.w, d.last.h);
  };
  ["pointerdown","mousedown","touchstart"].forEach(ev => cv.addEventListener(ev, start, {passive:false}));
  ["pointermove","mousemove","touchmove"].forEach(ev => window.addEventListener(ev, move, {passive:false}));
  ["pointerup","mouseup","touchend","pointercancel"].forEach(ev => window.addEventListener(ev, end));
}

  document.querySelectorAll("[data-vorlage-del]").forEach(b => b.onclick = () => {

    S.wagerl = dreiWagerl();

  };
  document.querySelectorAll("[data-wagerl-nehmen]").forEach(b => b.onclick = async () => {
    const k = b.getAttribute("data-wagerl-nehmen");
    const wv = S.wagerl && S.wagerl[k]; if(!wv) return;
    // Ergänzen, nie ersetzen (Entscheidung 11, probeweise): Bestehendes bleibt,

      toast(t.title+" erledigt");
      return Object.assign({},t,{ doneAt:today(), doneBy:S.meId, skips:0, updatedAt:now() });
    }));
  };
  const sk=$("#skipTaskBtn"); if(sk) sk.onclick = async () => {
    const id=S.taskId; S.modal=null; S.prodSel={};
    await skipTask(id);
  };
  const dl=$("#delTask"); if(dl) dl.onclick = async () => {
    const id=S.taskId; S.modal=null; S.prodSel={};
    await updateItems("tasks", list => list.map(t => t.id===id ? Object.assign({},t,{deleted:true, updatedAt:now()}) : t));
  };
  const sw=$("#switchMe"); if(sw) sw.onclick=()=>{ S.modal=null; S.phase="choose"; render(); };
  const lk=$("#lock"); if(lk) lk.onclick=lockApp;
  const o2=$("#openSync2"); if(o2) o2.onclick=()=>{ S.modal="sync"; render(); };
  const rs=$("#reset"); if(rs) rs.onclick=()=>{
    $("#resetBox").innerHTML = '<div class="note bad" style="margin-top:10px">Wirklich alle Listen und das Passwort auf diesem Handy löschen?'
      + '<div class="row" style="margin-top:8px"><button class="btn" id="yes" style="height:40px;width:auto;padding:0 16px;background:var(--rose)">Ja, löschen</button>'
      + '<button class="btn ghost" id="no" style="height:40px;width:auto;padding:0 16px">Abbrechen</button></div></div>';
    $("#yes").onclick=resetAll; $("#no").onclick=()=>{ $("#resetBox").innerHTML=""; };
  };
  const ss=$("#saveSync"); if(ss) ss.onclick = async () => {
    const url=apiBase($("#sUrl").value), key=($("#sKey").value||"").trim();
    if(!url || !key){ S.syncNote={cls:"note bad", html:"Bitte beide Felder ausfüllen."}; render(); return; }
    lsSet(LS.sync, {url, key}); S.sync={url, key};
    S.syncNote={cls:"note", html:'<span style="color:var(--mut)">Teste Verbindung …</span>'}; render();
    await syncNow(true);
    if(S.syncState==="ok"){
      S.syncNote={cls:"note ok", html:"Verbunden. Eure Listen syncen ab jetzt automatisch."};
      toast("Sync aktiv");
    } else {
      const m = String(S.syncMsg||"");
      let hint = "URL und Key prüfen, und ob die Tabelle angelegt wurde.";
      if(/404/.test(m)) hint = "Tabelle <code>zettl</code> nicht gefunden – lief das SQL oben durch? Die URL braucht nur den Teil bis <code>.supabase.co</code>.";
      else if(/401|403/.test(m)) hint = "Der Schlüssel passt nicht. Nimm den <b>anon public</b> bzw. <b>publishable</b> Key – nicht den geheimen.";
      else if(/Failed to fetch|NetworkError|Load failed/i.test(m)) hint = "Keine Verbindung zur Datenbank. Internet prüfen und nochmal versuchen.";
      S.syncNote={cls:"note bad", html:"Klappt nicht: "+esc(m)+"<br>"+hint};
    }
    render();
  };
  const ci=$("#copyInvite"); if(ci) ci.onclick = async () => {
    const link = inviteLink(); if(!link) return;
    const done = await copyInvite();
    $("#inviteBox").innerHTML = '<div class="note '+(done?"ok":"warn")+'" style="margin-top:8px">'
      + (done ? "Link kopiert – jetzt an deine Partnerin schicken." : "Kopieren ging nicht. Link von Hand kopieren:")
      + '<div style="margin-top:6px;word-break:break-all;font-size:11px">'+esc(link)+'</div></div>';
    if(done) toast("Link kopiert");
  };

  const off=$("#offSync"); if(off) off.onclick=()=>{ lsDel(LS.sync); S.sync=null; S.syncState="off"; S.modal=null; render(); };
}

// ------------------------------------------------------- Auto-Sync & Start
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState==="visible" && S.phase==="main" && syncOn()) syncNow(true);
});
setInterval(() => { if(document.visibilityState==="visible" && S.phase==="main" && syncOn()) syncNow(true); }, 20000);

// Startbildschirm nach dem Ausblenden entfernen, Antippen überspringt ihn
(function(){
  const weg = () => { const s = document.getElementById("splash"); if(s && s.parentNode) s.parentNode.removeChild(s); };
  const s = document.getElementById("splash");
  if(s){ s.addEventListener("click", weg); setTimeout(weg, 2300); }
})();

if(typeof window!=="undefined") window.__zettl = { S, boot, doSetup, doUnlock, syncNow, updateItems, readLocal, writeLocal, setRoomRect, findShops, saveShops, savePlanBg, LS };
boot();
</script>
