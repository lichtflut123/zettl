<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Zettl">
<title>Zettl – ein Zettel für alle</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231c1917'/%3E%3Ctext x='50' y='70' font-size='58' font-family='Georgia,serif' font-weight='bold' fill='%23fff' text-anchor='middle'%3EZ%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231c1917'/%3E%3Ctext x='50' y='70' font-size='58' font-family='Georgia,serif' font-weight='bold' fill='%23fff' text-anchor='middle'%3EZ%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f5f5f4; --card:#fff; --line:#e7e5e4; --ink:#292524; --mut:#78716c; --soft:#a8a29e;
  --dark:#1c1917; --amber:#f59e0b; --teal:#0d9488; --rose:#e11d48; --rosebg:#fff1f2;
  --warn:#92400e; --warnbg:#fffbeb; --warnline:#fde68a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.4;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.pad{padding:0 16px}
h1,h2,.disp{font-family:Georgia,"Times New Roman",serif;letter-spacing:-.01em}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
.center{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:32px 24px}
.brand{font-family:Georgia,serif;font-weight:700;font-size:26px;letter-spacing:-.02em}
.brand span{color:var(--soft)}
.h1{font-family:Georgia,serif;font-size:20px;font-weight:700;margin:6px 0 0}
.sub{color:var(--mut);font-size:14px;margin:4px 0 0}
.muted{color:var(--soft);font-size:12px;line-height:1.5}
.field{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:0 16px;height:50px}
.field input{flex:1;min-width:0;border:0;outline:none;background:none;font-size:16px}
.field input::placeholder{color:var(--soft)}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.dot.amber{background:var(--amber)} .dot.teal{background:var(--teal)}
.btn{height:50px;border-radius:16px;background:var(--dark);color:#fff;font-family:Georgia,serif;font-weight:700;font-size:16px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:disabled,.btn.off{background:#e7e5e4;color:var(--soft)}
.btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--ink);font-weight:600}
.link{color:var(--mut);text-decoration:underline;font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.stack{display:flex;flex-direction:column;gap:10px}
.head{position:sticky;top:0;z-index:9;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 16px 10px}
.who{font-family:Georgia,serif;font-weight:700;font-size:19px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.who .dot{width:9px;height:9px}
.who .amp{color:var(--soft);font-weight:400}
.icons{display:flex;gap:2px}
.icon{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:17px}
.icon:active{background:var(--line)}
.tabs{display:flex;background:var(--line);border-radius:999px;padding:4px;margin-top:12px}
.tabs button{flex:1;height:36px;border-radius:999px;font-family:Georgia,serif;font-weight:700;font-size:14px;color:var(--mut)}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.list{padding:12px 16px 170px;flex:1}
.item{position:relative;display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 4px 12px 14px;margin-bottom:8px}
.item .bar{position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--soft)}
.item .bar.amber{background:var(--amber)} .item .bar.teal{background:var(--teal)}
/* Warengruppe als Farbe am Strich – in der Marktreihenfolge von Obst bis Kassa.
   Die Farbe ist der zweite Hinweis, nicht der erste: das Symbol in derselben Zeile
   trägt die Bedeutung, denn zwölf Farben auf vier Pixel Breite lassen sich nicht
   zuverlässig unterscheiden. Benachbarte Abteilungen sind zusätzlich in der
   Helligkeit getrennt, damit sie auch bei Rot-Grün-Blindheit auseinanderfallen –
   Brot und Fleisch waren als Orange und Rot dort nicht unterscheidbar. */
.item .bar.k-obst{background:#16a34a}
.item .bar.k-backwaren{background:#92400e}
.item .bar.k-fleisch{background:#e11d48}
.item .bar.k-kuehl{background:#0284c7}
.item .bar.k-tiefkuehl{background:#0891b2}
.item .bar.k-vorrat{background:#a16207}
.item .bar.k-suess{background:#db2777}
.item .bar.k-getraenke{background:#4f46e5}
.item .bar.k-haushalt{background:#64748b}
.item .bar.k-drogerie{background:#9333ea}
.item .bar.k-tierbedarf{background:#78350f}
.item .bar.k-sonst{background:var(--mut)}
/* Wer den Eintrag angelegt hat – klein vor dem Namen, seit die Farbe des Strichs
   die Warengruppe zeigt */
.wer{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:middle;background:var(--soft)}
.wer.amber{background:var(--amber)} .wer.teal{background:var(--teal)}
.box{width:24px;height:24px;border-radius:50%;border:2px solid #d6d3d1;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px}
.box.on{background:var(--dark);border-color:var(--dark)}
.grow{flex:1;min-width:0;text-align:left}
.name{display:block;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{display:block;font-size:12px;color:var(--soft);margin-top:1px}
.item.done{opacity:.55}
.item.done .name{text-decoration:line-through;color:var(--soft)}
.x{width:36px;height:36px;border-radius:50%;color:#d6d3d1;font-size:17px;flex:none;display:flex;align-items:center;justify-content:center}
.x:active{background:var(--bg)}
.ric{flex:none;vertical-align:-3px;opacity:.75}
.canvas{position:relative;width:100%;padding-top:100%;background:var(--card);border:1px solid var(--line);
  border-radius:16px;background-size:cover;background-position:center;overflow:hidden;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:5% 5%}
.canvas.edit{outline:2px dashed var(--soft);outline-offset:-3px}
.canvas.mini{padding-top:58%;margin-bottom:12px}
.canvas.mini .rname{font-size:11px;gap:3px}
.canvas.mini .rbox{padding:4px;border-radius:8px}
.canvas.mini .rbadge{font-size:10px;padding:0 5px}
.rbox{position:absolute;background:rgba(255,255,255,.92);border:1.5px solid var(--soft);border-radius:10px;
  display:flex;flex-direction:column;justify-content:space-between;padding:6px;overflow:hidden;text-align:left}
.rbox.due{border-color:var(--amber);background:rgba(255,251,235,.95)}
.rbox.over{border-color:var(--rose);background:rgba(255,241,242,.95)}
.canvas.edit .rbox{cursor:move;touch-action:none}
.rname{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:600;line-height:1.15;overflow:hidden}
.rname span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rbadge{font-size:11px;color:var(--mut);background:var(--bg);border-radius:999px;padding:1px 6px;align-self:flex-start}
.rhandle{position:absolute;right:0;bottom:0;width:22px;height:22px;cursor:nwse-resize;touch-action:none;
  background:linear-gradient(135deg,transparent 50%,var(--soft) 50%);border-bottom-right-radius:9px}
.basket{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:10px;font-size:14px}
.floorbar{display:flex;gap:6px;overflow-x:auto;padding:2px 0 2px;margin-bottom:2px;-webkit-overflow-scrolling:touch}
.floorbar::-webkit-scrollbar{display:none}
.floorbar .chip{flex:none;height:32px;font-size:13px}
.roomhead{display:flex;align-items:center;gap:7px}
.foldbtn{display:flex;align-items:center;gap:6px;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;padding:2px 0;min-width:0}
.foldbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev{width:11px;flex:none;color:var(--soft);font-size:10px}
.secright{display:flex;align-items:center;gap:8px;flex:none}
.cnt{background:var(--line);color:var(--mut);border-radius:999px;padding:1px 7px;font-size:11px;font-weight:600;letter-spacing:0}
.sec{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);margin:16px 2px 8px;display:flex;justify-content:space-between;align-items:center}
.badge{font-size:11px;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:999px;padding:3px 8px;flex:none}
.badge.today{background:var(--line);color:var(--ink);font-weight:600;border-color:#d6d3d1}
.badge.over{background:var(--rosebg);color:#be123c;border-color:#fecdd3}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:10}
.dock .inner{max-width:520px;margin:0 auto;padding:0 12px calc(12px + env(safe-area-inset-bottom))}
/* Spalte mit fester Eingabezeile: wird es eng, schrumpfen die Bereiche darüber.
   Vorher standen 46vh Treffer und 38vh Chips nebeneinander im Budget von 86vh –
   die Eingabezeile fiel unten aus der Leiste und war nicht mehr erreichbar. */
.bar-add{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:0 6px 24px rgba(0,0,0,.10);overflow:hidden;display:flex;flex-direction:column;max-height:86vh}
/* Trefferliste: scrollbar statt abgeschnitten */
.hits{padding:10px 12px 4px;border-bottom:1px solid var(--line);max-height:46vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;flex:0 1 auto;min-height:0}
.hits .item{margin-bottom:6px}
.detail{padding:12px 14px 4px;border-bottom:1px solid var(--line);max-height:38vh;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:0 1 auto;min-height:0}
.bar-add .line{display:flex;align-items:center;gap:8px;padding:8px;flex:none}
.barTop{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 0 16px;flex:none}
.bar-add input{flex:1;min-width:0;height:44px;border:0;outline:none;background:none;padding:0 8px;font-size:16px}
.add{width:44px;height:44px;border-radius:14px;background:var(--dark);color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;flex:none}
.add.off{background:#e7e5e4;color:var(--soft)}
.eur{height:44px;padding:0 12px;border-radius:12px;color:var(--soft);font-size:15px;flex:none}
.eur.on{background:var(--bg);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--mut);font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--dark);border-color:var(--dark);color:#fff}
/* Zuletzt gekauft – sitzt unter den Artikeln, deshalb gedeckelt statt endlos */
.zuletzt{margin:14px 0 4px;max-height:26vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
/* Auf dem leeren Zettel steht darüber die zentrierte Leermeldung – da braucht der
   Wechsel auf linksbündige Chips mehr Luft als die 14px zwischen zwei Listenteilen */
.empty + .zuletzt{margin-top:32px}
.summe{margin-top:16px}
/* Die Klimakarte rückt an die Kostenkarte heran – aber nur, wenn es eine gibt.
   Als inline-Stil an der Karte selbst wirkte der Ausgleich auch dann, wenn sie
   allein steht, und zog sie an den Verlauf darüber. */
.summe > .basket + .basket{margin-top:-4px}
/* Alternativen im Artikel-Dialog: eigener Scrollbereich, sonst wächst das Blatt endlos */
.alts{max-height:30vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:0 8px 30px rgba(0,0,0,.14);padding:16px;max-height:72vh;overflow-y:auto}
.sheet .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sheet .ttl{font-family:Georgia,serif;font-weight:700}
.modal{position:fixed;inset:0;z-index:20;background:rgba(28,25,23,.35);display:flex;align-items:flex-end;justify-content:center}
.modal .sheet{width:100%;max-width:520px;border-radius:24px 24px 0 0;border-bottom:0;padding-bottom:calc(20px + env(safe-area-inset-bottom));max-height:88vh}
.note{font-size:12px;border-radius:12px;padding:9px 12px;line-height:1.5}
.note.warn{color:var(--warn);background:var(--warnbg);border:1px solid var(--warnline)}
.note.bad{color:#be123c;background:var(--rosebg);border:1px solid #fecdd3}
.note.ok{color:#065f46;background:#ecfdf5;border:1px solid #a7f3d0}
.toast{position:fixed;left:0;right:0;bottom:104px;z-index:15;display:flex;justify-content:center;pointer-events:none}
.toast div{background:var(--dark);color:#fff;font-size:14px;border-radius:12px;padding:10px 16px;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.empty{text-align:center;margin-top:64px;padding:0 24px}
.empty b{font-family:Georgia,serif;color:var(--mut);display:block}
.empty span{font-size:14px;color:var(--soft)}
code{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:2px 5px;font-size:12px}
pre{background:var(--dark);color:#e7e5e4;border-radius:12px;padding:12px;font-size:11px;overflow-x:auto;white-space:pre;margin:8px 0}
label.lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);display:block;margin-bottom:6px}
.spin{display:inline-block;animation:sp 1s linear infinite}
/* Startbildschirm: zwei Sekunden sichtbar, dann sanft weg */
#splash{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;align-items:center;justify-content:center;
  animation:splashOut .5s ease 1.7s forwards}
.sp-in{text-align:center;animation:splashIn .5s ease}
.sp-name{font-family:Georgia,serif;font-weight:700;font-size:40px;letter-spacing:-.02em;color:var(--dark)}
.sp-name span{color:var(--soft)}
.sp-sub{color:var(--mut);font-size:14px;margin-top:6px}
@keyframes splashIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes splashOut{to{opacity:0;visibility:hidden;pointer-events:none}}
/* Laufschrift für Beschriftungen, die nicht in den Reiter passen */
.tabs button{overflow:hidden}
.tabs .lauf{display:inline-block;white-space:nowrap;animation:lauf 9s linear infinite}
@keyframes lauf{0%,10%{transform:translateX(0)}90%,100%{transform:translateX(var(--weg,-40px))}}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="splash">
  <div class="sp-in">
    <div class="sp-name">Zettl<span>·</span></div>
    <div class="sp-sub">Ein Zettel für alle</div>
  </div>
</div>
<div id="app" class="wrap"></div>
<script>
"use strict";
// =====================================================================
// Zettl – ein Zettel für alle
// Läuft komplett in dieser Datei. Daten liegen lokal im Browser und
// (optional) verschlüsselt in eurer eigenen Supabase-Datenbank.
// =====================================================================

const STORES = ["Billa","Lidl","Hofer","Spar","Penny","dm"];

// Warengruppen in typischer Marktreihenfolge (Eingang -> Kassa)
const CATS = [
  {k:"obst",      l:"Obst & Gemüse"},
  {k:"backwaren", l:"Brot & Gebäck"},
  {k:"fleisch",   l:"Fleisch & Wurst"},
  {k:"kuehl",     l:"Kühlregal"},
  {k:"tiefkuehl", l:"Tiefkühl"},
  {k:"vorrat",    l:"Vorrat & Trocken"},
  {k:"suess",     l:"Süßes & Snacks"},
  {k:"getraenke", l:"Getränke"},
  {k:"haushalt",  l:"Haushalt"},
  {k:"drogerie",  l:"Drogerie"},
  {k:"tierbedarf",l:"Tierbedarf"},
  {k:"sonst",     l:"Sonstiges"}
];
const catLabel = (k) => (CATS.find(c=>c.k===k)||{l:"Sonstiges"}).l;

const CIC = {
  obst:      '<path d="M12 8c1-3 3-4 5-4 0 2-1 4-3 5M12 8c-3 0-5 2-5 6s3 7 5 7 2-1 3-1 1 1 3 1 4-3 4-7-2-6-5-6c-1 0-2 .5-3 .5S13 8 12 8z"/>',
  backwaren: '<path d="M4 12c0-3 2-5 5-5h6c3 0 5 2 5 5s-2 5-5 5H9c-3 0-5-2-5-5zM9 8v8M13 8v8M17 8v8"/>',
  fleisch:   '<path d="M7 5h8a4 4 0 0 1 4 4v6a4 4 0 0 1-4 4H7a4 4 0 0 1 0-8h1a2 2 0 0 0 0-4H7a2 2 0 0 1 0-2zM14 10a2 2 0 1 0 0 4"/>',
  kuehl:     '<path d="M7 3h8l1 4H6zM6 7h12v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1zM9 12h6"/>',
  tiefkuehl: '<path d="M12 3v18M4.5 7.5l15 9M19.5 7.5l-15 9M12 7l-2.5-2M12 7l2.5-2M12 17l-2.5 2M12 17l2.5 2"/>',
  vorrat:    '<path d="M5 8h14v12a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1zM5 8l2-4h10l2 4M9 12h6"/>',
  suess:     '<path d="M9 9h6v6H9zM9 12H3l2-3v6zM15 12h6l-2-3v6"/>',
  getraenke: '<path d="M9 3h6v3l2 3v11a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V9l2-3zM7 13h10"/>',
  haushalt:  '<path d="M6 21V9h6v12zM9 9V3h9v4M15 5h4M9 13h3M6 21h12"/>',
  drogerie:  '<path d="M10 3h4v4h-4zM8 7h8l1 12a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2zM9 12h6"/>',
  tierbedarf:'<path d="M6 11a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM18 11a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM10 7a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM14 7a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM12 21c3 0 5-1.5 5-4 0-2-2-4-5-4s-5 2-5 4c0 2.5 2 4 5 4z"/>',
  sonst:     '<path d="M4 5h3l2.5 10h9L21 8H7M10 20a1 1 0 1 0 0-2 1 1 0 0 0 0 2zM18 20a1 1 0 1 0 0-2 1 1 0 0 0 0 2z"/>'
};
function catIcon(k, size){
  const s = size || 18;
  return '<svg class="ric" width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" '
       + 'stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(CIC[k]||CIC.sonst)+'</svg>';
}

// Erkennt die Warengruppe aus dem Artikelnamen (österreichischer Sprachgebrauch)
const CAT_WORDS = [
  ["obst", ["apfel","äpfel","banan","birne","orange","mandarin","zitron","limette","traub","erdbeer","himbeer","heidelbeer","brombeer","kirsch","marille","pfirsich","nektarin","zwetschk","pflaume","melone","ananas","mango","kiwi","avocado","tomat","gurke","salat","paprika","zwiebel","knoblauch","karotte","möhre","kartoffel","erdapfel","paradeiser","ribisel","zwetschk","fisolen","zucchini","melanzani","aubergin","brokkoli","karfiol","blumenkohl","spinat","kraut","kohl","lauch","porree","sellerie","radieschen","rettich","kürbis","mais","bohnen","erbsen","pilz","champignon","kräuter","petersilie","basilikum","schnittlauch","rucola","ingwer","obst","gemüse","oliven"]],
  ["backwaren", ["brot","semmel","weckerl","kipferl","croissant","gebäck","baguette","toast","brötchen","striezel","brioche","laugen","knäcke","zwieback","kuchen","torte","strudel","germknödel","donut","muffin","zimtfächer","focaccia"]],

// Längster Treffer gewinnt, Wortanfang zählt extra. Sonst würde "Reis" im
// Tiefkühl landen (wegen "eis") und "Zahnpasta" im Vorrat (wegen "pasta").
// Erst in den Händlerdaten nachsehen, dann erst raten – dort steht die
// Warengruppe schwarz auf weiß, unsere Wortliste ist nur die Notlösung.
// Warengruppen aus der Preisdatei sind Fremddaten – deren Adresse ist ein freies
// Eingabefeld. Ein unbekannter Schlüssel würde sonst als Klassenname im Markup landen
// und den Artikel aus der nach Abteilungen sortierten Liste verschwinden lassen.
function katOk(k){ return CATS.some(c => c.k === k) ? k : null; }
function katFuer(name){
  if(pdIndex && pdIndex.length){
    name = nameOhneGroesse(name);
    const n = norm(name);
    const exakt = pdIndex.find(e => katOk(e.cat) && e.n === n);
    if(exakt) return katOk(exakt.cat);
    const treffer = pdSuche(name, 3).filter(t => katOk(t.cat));
    if(treffer.length && norm(treffer[0].name).indexOf(n) >= 0) return katOk(treffer[0].cat);
  }
  return guessCat(name);
}
function guessCat(name){
  const n = norm(name);
  let cat = "sonst", score = 0;
  for(const [c, words] of CAT_WORDS_N){       // gefaltet, passend zu norm()
    for(const w of words){
      const i = n.indexOf(w);
      if(i < 0) continue;
      const atStart = (i === 0) || /[\s\-]/.test(n.charAt(i-1));
      const s = w.trim().length * 2 + (atStart ? 1 : 0);
      if(s > score){ score = s; cat = c; }
    }
  }
  return cat;
}

// Menge aus einer Vorlagen-Position lesen: "3 l Milch" → 3 l + "Milch",
// "6 Bananen" → 6 stk + "Bananen". Nur eine FÜHRENDE Zahl zählt – "Emmentaler 45%"
// hat keine Menge. Eine nackte Zahl vor einem Wort heißt Stück, aber nur ganzzahlig:
// "1,5 Milch" wäre keine Stückzahl, sondern ein Tippfehler, und bleibt Name.
// (Konzept: docs/drei-wagerl.md, Entscheidung 2.)
function vorlageMenge(text){
  const t = String(text||"").trim();
  let m = t.match(/^(\d+(?:[.,]\d+)?)\s*(ml|l|kg|g|stück|stueck|stk|st\.?)\s+(.+)$/i);
  if(m){
    const wert = parseFloat(m[1].replace(",", "."));
    let einheit = m[2].toLowerCase().replace(/\.$/,"");
    if(einheit==="st" || einheit==="stück" || einheit==="stueck") einheit = "stk";
    return { wert, einheit, rest: m[3].trim() };
  }
  m = t.match(/^(\d+)\s+(\D.+)$/);
  if(m) return { wert: parseInt(m[1], 10), einheit: "stk", rest: m[2].trim() };
  return { wert: null, einheit: null, rest: t };
}

// --------------------------------------------------------- Verschlüsselung
const enc = new TextEncoder(), dec = new TextDecoder();
const sub = () => (typeof crypto!=="undefined" && crypto.subtle) ? crypto.subtle : null;
function b64(buf){ let s=""; const b=new Uint8Array(buf); for(let i=0;i<b.length;i++) s+=String.fromCharCode(b[i]); return btoa(s); }
function unb64(s){ const t=atob(s), b=new Uint8Array(t.length); for(let i=0;i<t.length;i++) b[i]=t.charCodeAt(i); return b.buffer; }
function randSalt(){ const b=new Uint8Array(16); crypto.getRandomValues(b); return b64(b.buffer); }
async function deriveKey(pw, salt){
  const s=sub(); if(!s) return null;
  try{
    const base = await s.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
    return await s.deriveKey({name:"PBKDF2", salt:unb64(salt), iterations:120000, hash:"SHA-256"},
      base, {name:"AES-GCM", length:256}, true, ["encrypt","decrypt"]);
  }catch(e){ return null; }
}
async function encJson(key, obj){
  const iv=new Uint8Array(12); crypto.getRandomValues(iv);
  const ct=await sub().encrypt({name:"AES-GCM", iv}, key, enc.encode(JSON.stringify(obj)));
  return {__enc:1, iv:b64(iv.buffer), ct:b64(ct)};
}
async function decJson(key, p){
  if(!key||!p||!p.ct) return null;
  try{
    const pt=await sub().decrypt({name:"AES-GCM", iv:new Uint8Array(unb64(p.iv))}, key, unb64(p.ct));
    return JSON.parse(dec.decode(pt));
  }catch(e){ return null; }
}
async function keyOut(k){ try{ return b64(await sub().exportKey("raw",k)); }catch(e){ return null; } }
async function keyIn(s){ try{ return await sub().importKey("raw", unb64(s), {name:"AES-GCM"}, true, ["encrypt","decrypt"]); }catch(e){ return null; } }

// ------------------------------------------------- Lesen/Schreiben (lokal)
// Jede Änderung besteht aus Lesen, Ändern, Schreiben. Ohne Reihenfolge können
// sich zwei schnelle Aktionen überholen und eine davon geht verloren – deshalb
// laufen alle Änderungen streng nacheinander durch diese Sperre.
let opLock = Promise.resolve();
// Merkt sich, dass dieser Haushalt verschlüsselt gespeichert hat. Anders als
// S.vault überlebt die Marke das Wegfallen des Schlüssels und macht die
// Klartextsperre in writeLocal unabhängig davon, in welcher Reihenfolge
// Sperren, Zurücksetzen und ein laufender Sync sich in die Quere kommen.
let e2eJemals = false;
function withLock(fn){
  const run = () => fn();
  const p = opLock.then(run, run);
  opLock = p.catch(() => {});
  return p;
}

// Verschlüsselt gespeichertes ohne Schlüssel zu lesen ergibt die Rücklage – also
// eine leere Liste. Wer damit weiterrechnet, hält Leeres für den echten Stand.
// Deshalb sagt der zweite Rückgabewert, ob wirklich gelesen werden konnte.
async function readLocal(name, fb){
  const raw = lsGet(LS[name], null);
  if(raw==null) return fb;
  if(raw && raw.__enc){ const p = await decJson(S.key, raw); return p==null?fb:p; }
  return raw;
}
function lesbar(name){
  const raw = lsGet(LS[name], null);
  return !(raw && raw.__enc && !S.key);
}
async function writeLocal(name, value){
  // Nie Klartext schreiben, wenn der Haushalt verschlüsselt ist. Fällt der
  // Schlüssel mitten in einem Lauf weg – Sperren oder Zurücksetzen während eines
  // Syncs –, landeten sonst Namen und Listen unverschlüsselt im Speicher und in
  // der Datenbank, und zwar mit leerem Inhalt: doppelter Schaden.
  // Die Sperre darf dabei nicht an S.vault hängen: "Alles auf diesem Handy
  // löschen" nullt S.key UND S.vault, damit wären beide Wächter gleichzeitig
  // blind. e2eJemals bleibt stehen, bis der Haushalt bewusst zurückgesetzt ist.
  if(!S.key && (S.vault || e2eJemals)) return false;
  const payload = S.key ? await encJson(S.key, value) : value;
  return lsSet(LS[name], payload);
}

// ------------------------------------------------------------ Merge-Logik
// Jeder Eintrag hat updatedAt; gelöschte bleiben 30 Tage als Grabstein liegen,
// damit ein Handy sie nicht wieder "aufweckt".
function mergeItems(a, b){
  const map = new Map();
  for(const it of [].concat(a||[], b||[])){
    if(!it || !it.id) continue;
    const prev = map.get(it.id);
    if(!prev || (it.updatedAt||0) > (prev.updatedAt||0)) map.set(it.id, it);
  }
  const cutoff = now() - 30*86400000;
  return [...map.values()].filter(it => !(it.deleted && (it.updatedAt||0) < cutoff));
}
// Zwei Einträge zum selben Artikel feldweise zusammenführen statt den ganzen zu
// ersetzen. Vorher gewann der jüngere komplett – haken beide Handys am selben Tag
// ab oder trägt eines einen Preis nach, ging dem anderen sein Kaufdatum verloren.
function mergePriceEntry(a, b){
  a = normPriceEntry(a); b = normPriceEntry(b);
  if(!a) return b;
  if(!b) return a;
  const neuer = (b.updatedAt||0) >= (a.updatedAt||0) ? b : a, alt = (neuer === b) ? a : b;
  const byStore = Object.assign({}, alt.byStore);
  for(const s in (neuer.byStore||{})){
    const x = neuer.byStore[s], y = byStore[s];
    if(!y || String(x.at||"") >= String(y.at||"")) byStore[s] = x;   // je Laden der frischere Preis
  }
  // vergessenAt schneidet Käufe ab, die jemand bewusst gelöscht hat. Ohne das
  // holt eine Vereinigung sie beim nächsten Sync vom anderen Handy zurück.
  // Das Zurücknehmen braucht einen eigenen Zeitstempel: noteBought löschte die
  // Marke nur auf diesem Handy, die Vereinigung holte sie per Math.max vom
  // anderen zurück – und schnitt damit genau den Kauf weg, der sie aufgehoben
  // hatte. Wer zuletzt gehandelt hat, gewinnt: gekauft schlägt vergessen.
  const vergessen = Math.max(a.vergessenAt||0, b.vergessenAt||0);
  const wieder = Math.max(a.wiederAt||0, b.wiederAt||0);
  const gilt = vergessen > wieder ? vergessen : 0;
  const grenze = gilt ? tagVon(gilt) : null;
  const buys = [...new Set([].concat(a.buys||[], b.buys||[]))]
    .filter(d => typeof d === "string" && d && (!grenze || d > grenze))
    .sort().slice(-12);
  const out = { byStore, last: neuer.last || alt.last,
    lastName: neuer.lastName || alt.lastName, buys,
    updatedAt: Math.max(a.updatedAt||0, b.updatedAt||0) };
  if(vergessen) out.vergessenAt = vergessen;
  if(wieder) out.wiederAt = wieder;
  return out;
}
function mergePrices(a, b){
  const out = Object.assign({}, a||{});
  for(const k in (b||{})) out[k] = out[k] ? mergePriceEntry(out[k], b[k]) : b[k];
  return out;
}

// Supabase REST. Gespeichert wird nur Chiffrat (außer dem Tresor-Umschlag).
function syncCfg(){ return lsGet(LS.sync, null); }
// Verträgt sowohl "https://xxx.supabase.co" als auch die volle REST-Adresse
// "https://xxx.supabase.co/rest/v1/" – sonst gäbe es /rest/v1/rest/v1 und 404.
function apiBase(u){
  let s = String(u||"").trim().replace(/\s+/g,"");
  if(!s) return "";
  if(!/^https?:\/\//i.test(s)) s = "https://" + s;
  s = s.replace(/\/+$/,"");
  s = s.replace(/\/rest(\/v1)?$/i,"");
  return s;
}
function syncOn(){ const c=syncCfg(); return !!(c && c.url && c.key); }
// Ohne Zeitlimit legt eine einzige hängende Anfrage den ganzen Sync still: die
// Wiedereintrittssperre gibt syncLaeuft erst im finally frei, und das läuft dann
// nie. Vorher war eine hängende Anfrage ein verlorener Lauf, seit der Sperre wäre
// sie ein toter Sync bis zum Neuladen der Seite.
const NETZ_ZEIT = 15000;
async function netz(url, opt){
  const ac = (typeof AbortController !== "undefined") ? new AbortController() : null;
  const t = ac ? setTimeout(() => ac.abort(), NETZ_ZEIT) : null;
  try{
    return await fetch(url, ac ? Object.assign({}, opt||{}, { signal: ac.signal }) : opt);
  }catch(e){
    throw (e && e.name === "AbortError")
      ? new Error("Keine Antwort nach " + Math.round(NETZ_ZEIT/1000) + " Sekunden")
      : e;
  }finally{ if(t) clearTimeout(t); }
}
async function remoteGet(name){
  const c=syncCfg(); if(!c) return null;
  const r = await netz(apiBase(c.url)+"/rest/v1/zettl?id=eq."+encodeURIComponent(name)+"&select=data",
    { headers:{ apikey:c.key, Authorization:"Bearer "+c.key } });
  if(!r.ok) throw new Error("HTTP "+r.status);
  const rows = await r.json();
  return (rows && rows[0]) ? rows[0].data : null;
}
async function remotePut(name, data){
  const c=syncCfg(); if(!c) return false;
  const r = await netz(apiBase(c.url)+"/rest/v1/zettl",
    { method:"POST",
      headers:{ apikey:c.key, Authorization:"Bearer "+c.key, "Content-Type":"application/json",
                Prefer:"resolution=merge-duplicates,return=minimal" },
      body: JSON.stringify({ id:name, data, updated_at:new Date().toISOString() }) });
  if(!r.ok) throw new Error("HTTP "+r.status);
  return true;
}
// Holt Fremdes, mischt mit Eigenem, schreibt das Ergebnis zurück.
// Läuft schon einer? Dann nicht ein zweites Mal starten, sondern hinterher einmal
// nachziehen. Ein Tipp auf "Ins Wagerl" löste vorher zwei Läufe gleichzeitig aus –
// updateItems einen und noteBought einen –, zusammen rund 30 Anfragen. Und wenn
// der ältere Lauf hinterherkam, schrieb er den Stand OHNE den frischen
// Kaufvermerk auf den Server; genau den holt sich das andere Handy dann.
let syncLaeuft = false, syncNochmal = false;
async function syncNow(silent){
  if(!syncOn()){ S.syncState="off"; if(!silent) render(); return; }
  // Ohne Schlüssel gibt es nichts abzugleichen: Fremdes lässt sich nicht
  // entschlüsseln und Eigenes nicht lesen. Ein Lauf ohne Schlüssel mischte Leeres
  // mit Leerem und schriebe das Ergebnis über den echten Stand. Genau das drohte
  // nach "Alles auf diesem Handy löschen": dort fallen S.key und S.vault zusammen
  // weg, und der nachgezogene Lauf unten aus dem finally fand beide Sperren blind
  // vor – er leerte die Datenbank und meldete dabei "ok".
  if(!S.key){ syncNochmal = false; S.syncState="off"; if(!silent) render(); return; }
  if(syncLaeuft){ syncNochmal = true; return; }
  syncLaeuft = true;
  // Der Schlüssel zum Startzeitpunkt. Sperren und Zurücksetzen setzen S.key
  // mitten in die Schleife auf null; danach kann sie weder Fremdes entschlüsseln
  // noch Eigenes lesen, mischt Leeres mit Leerem und schreibt das Ergebnis über
  // den echten Stand – lokal und in der Datenbank. Deshalb wird vor jedem
  // Datensatz geprüft, ob noch derselbe Schlüssel gilt.
  const key0 = S.key;
  S.syncState="busy"; S.syncMsg=null; if(!silent) render();
  try{
    // Tresor zuerst: ohne ihn kann das andere Handy nichts entschlüsseln
    const rv = await remoteGet("vault");
    if(!rv && S.vault) await remotePut("vault", S.vault);
    // Liegt in der Datenbank ein ANDERER Tresor, gehört sie zu einem anderen
    // Passwort. Das passiert nach "Alles auf diesem Handy löschen" und Neuanlage:
    // der alte Tresor bleibt liegen, die Daten würden aber mit dem neuen Schlüssel
    // überschrieben. Danach kann kein Handy mehr etwas entschlüsseln, und beide
    // löschen sich gegenseitig die Bestände – bei durchgehender Meldung "ok".
    // Deshalb hier anhalten statt weiterzuschreiben.
    else if(rv && S.vault && rv.salt && S.vault.salt && rv.salt !== S.vault.salt)
      throw new Error("In der Datenbank liegt ein anderer Haushalt. Sync angehalten, damit nichts überschrieben wird. "
        + "Entweder das ursprüngliche Passwort verwenden, oder unter ⚙ eine neue Datenbank eintragen.");

    for(const name of ["members","rooms","shopping","tasks","prices","plan","shops","vorlage"]){
      if(S.key !== key0) throw new Error("Abgebrochen – der Haushalt wurde zwischendurch gesperrt.");
      let theirsRaw = await remoteGet(name);          // Netzwerk außerhalb der Sperre
      let theirs = null;
      if(theirsRaw && theirsRaw.__enc) theirs = await decJson(S.key, theirsRaw);
      else if(theirsRaw) theirs = theirsRaw;

      let merged;
      await withLock(async () => {
      const mine = await readLocal(name,
        name==="prices" ? {} : name==="plan" ? {bg:{}} : name==="shops" ? {home:null,list:[]} : []);
      if(name==="plan"){
        // Grundriss-Hintergründe: je Geschoss gewinnt der jüngere Stempel – auch
        // wenn dahinter keine Skizze steht, denn das IST die Löschung (savePlanBg
        // lässt den Stempel als Grabstein stehen). Die alte Fassung nahm Fremdes
        // schon dann, wenn es hier fehlte – so kam Gelöschtes zurück. Und sie
        // verglich Stempel nur, wenn BEIDE Seiten welche hatten – eine Seite ohne
        // bgAt (alter Stand) konnte nie verlieren.
        const a = mine||{bg:{}}, b = theirs||{bg:{}};
        const at = (x,f) => (x.bgAt && x.bgAt[f]) || 0;
        const bg = {}, bgAt = {};
        const alle = new Set([].concat(Object.keys(a.bg||{}), Object.keys(b.bg||{}),
                                       Object.keys(a.bgAt||{}), Object.keys(b.bgAt||{})));
        for(const f of alle){
          // Gleichstand geht an das eigene Handy – bei zwei Ständen ohne Stempel
          // bleibt so die eigene Skizze stehen statt einer fremden.
          const sieger = at(b,f) > at(a,f) ? b : a;
          if(sieger.bg && sieger.bg[f] != null) bg[f] = sieger.bg[f];
          const t = Math.max(at(a,f), at(b,f));
          if(t) bgAt[f] = t;
        }
        merged = { bg, bgAt };
      }
      else if(name==="shops"){
        const a = mine||{home:null,list:[]}, b = theirs||{home:null,list:[]};
        const neuer = (x, y) => (!x ? y : !y ? x : ((x.at||0) >= (y.at||0) ? x : y));
        merged = { home: neuer(a.home, b.home),   // gelöscht ist {deleted:true,at} – ein Wert, kein Fehlen
                   car: neuer(a.car, b.car),
                   srv: neuer(a.srv, b.srv),     // auch das Entfernen muss ankommen
                   file: neuer(a.file, b.file),  // die eigene Preisdatei-Adresse; fehlte hier und wurde von jedem Sync gelöscht
                   list: mergeItems(a.list||[], b.list||[]) };
      }
      else if(name==="prices") merged = mergePrices(mine, theirs||{});
      else if(name==="members") merged = (mine && mine.length===2) ? mine : (theirs||mine||[]);
      else merged = mergeItems(mine, theirs||[]);

      // Fehlschlag beim Schreiben sichtbar machen. Vorher lief der Sync weiter,
      // lud den Stand hoch und meldete "ok", während lokal nichts angekommen war –
      // bei vollem oder blockiertem Speicher lief das Handy still auseinander.
      if(!(await writeLocal(name, merged)))
        throw new Error("Konnte " + name + " nicht speichern – der Browser-Speicher ist voll oder blockiert.");
      if(name==="prices") S.prices=merged;
      else if(name==="plan") S.plan=merged;
      else if(name==="shops") S.shops=merged;
      else if(name==="members") S.members=merged;
      else if(name==="rooms") S.rooms=merged;
      else if(name==="shopping") S.shopping=merged;
      else if(name==="vorlage") S.vorlage=merged;
      else S.tasks=merged;
      });

      // Letzte Sicherung vor dem Netz: lieber nichts hochladen als Klartext oder Leeres
      if(!S.key || S.key !== key0) throw new Error("Abgebrochen – der Haushalt wurde zwischendurch gesperrt.");
      await remotePut(name, await encJson(S.key, merged));
    }
    S.syncState="ok"; S.err=null;
  }catch(e){
    S.syncState="error";
    S.syncMsg = (e && e.message) ? e.message : String(e);
  }finally{
    syncLaeuft = false;
    // Während des Laufs kam noch eine Änderung – die einmal nachziehen. Im finally,
    // damit auch der Rückweg unten sie nicht verschluckt; über setTimeout, damit
    // sich die Läufe nicht ineinander schachteln.
    if(syncNochmal){ syncNochmal = false; setTimeout(() => syncNow(true), 0); }
  }
  // Kam per Sync ein fertiger Haushalt herein? Dann nicht im Setup hängen bleiben.
  if(S.key && S.phase==="setup" && S.members && S.members.length===2){ await loadAll(); return; }
  if(silent) renderQuiet(); else render();
}

// -------------------------------------------------------- Änderungen (CRUD)
async function updateItems(name, fn){
  const ok = await withLock(async () => {
    const cur = await readLocal(name, []);
    const next = fn(cur);
    if(name==="shopping") S.shopping=next; else S.tasks=next;
    const okW = await writeLocal(name, next);
    S.err = okW ? null : "Konnte nicht speichern – der Browser-Speicher ist voll oder blockiert.";
    render();
    return okW;
  });
  if(syncOn()) syncNow(true);
  return ok;
}
async function updateRooms(fn){

    const cur = await readLocal("rooms", []);
    const next = fn(cur);
    S.rooms = next;
    await writeLocal("rooms", next);

// ------------------------------------------------------------ Drei Wagerl
// Löst die Vorlage in drei Einkaufsvarianten auf (Konzept: docs/drei-wagerl.md).
// Etappe 1: ein Produkt je Position, knappste Packungsdeckung, keine Hinweise.

// Packungsgröße in eine Basiseinheit übersetzen: "250 g"→g, "1,5 l"→ml, "10 stk"→stk.
// Ohne verwertbare Angabe null – dann kann die Deckung nicht ehrlich gerechnet werden.
function wagerlBasis(unit){
  const m = String(unit||"").trim().match(/^(\d+(?:[.,]\d+)?)\s*(ml|l|kg|g|stk|stück|stueck|st\.?)$/i);
  if(!m) return null;
  const w = parseFloat(m[1].replace(",", "."));
  let e = m[2].toLowerCase().replace(/\.$/,"");
  if(e==="kg") return { menge: w*1000, art: "g" };
  if(e==="g")  return { menge: w,      art: "g" };
  if(e==="l")  return { menge: w*1000, art: "ml" };
  if(e==="ml") return { menge: w,      art: "ml" };
  return { menge: w, art: "stk" };
}
function wagerlZiel(mg){
  if(mg.wert==null) return null;
  if(mg.einheit==="kg") return { menge: mg.wert*1000, art: "g" };
  if(mg.einheit==="g")  return { menge: mg.wert,      art: "g" };
  if(mg.einheit==="l")  return { menge: mg.wert*1000, art: "ml" };
  if(mg.einheit==="ml") return { menge: mg.wert,      art: "ml" };
  return { menge: mg.wert, art: "stk" };
}

// Kandidaten zu einem Oberbegriff. Euer Verlauf zuerst (Entscheidung 3): hat der
// Haushalt unter dem Begriff schon konkret gekauft, bilden dieses Produkt und
// seinesgleichen – gleiche Warengruppe, gleiche Einheiten-Art – den Kreis.
// Erst ohne Verlauf gilt die nackte Relevanz-Suche.
function wagerlKandidaten(begriff){
  const roh = (pdIndex && pdIndex.length) ? pdSuche(nameOhneGroesse(begriff), 15) : [];
  const treffer = roh.filter(h => h.best && h.best.price != null);
  const e = priceInfo(begriff);
  if(e && e.lastName){
    const ln = norm(nameOhneGroesse(e.lastName));
    const gekauft = treffer.find(h => norm(nameOhneGroesse(h.name)) === ln);
    if(gekauft){
      const art = (wagerlBasis(gekauft.unit)||{}).art || null;
      const kreis = treffer.filter(h => h.cat === gekauft.cat
        && (!art || (wagerlBasis(h.unit)||{}).art === art));
      if(kreis.length) return kreis;
    }
  }
  return treffer;
}

// Knappste Deckung: kleinste Gesamtmenge >= Ziel, bei Gleichstand die billigste.
// Ein Produkt je Position, n-mal dieselbe Packung – Mischungen sind Etappe 2.
// Ohne Ziel (Position ohne Menge): 1 Packung, offen ausgewiesen.
function wagerlDeckung(kandidaten, ziel){
  let best = null;
  for(const h of kandidaten){
    const b = wagerlBasis(h.unit);
    let n = 1, gesamt = null;
    if(ziel){
      if(!b || b.art !== ziel.art) continue;      // nie €/kg gegen €/l oder Stück
      n = Math.max(1, Math.ceil(ziel.menge / b.menge));
      gesamt = n * b.menge;
    }
    const kosten = n * h.best.price;
    const kand = { h, n, gesamt, kosten };
    if(!best
       || (ziel && (gesamt < best.gesamt || (gesamt === best.gesamt && kosten < best.kosten)))
       || (!ziel && kosten < best.kosten)) best = kand;
  }
  return best;
}

// Eine Position nach der Regel einer Variante besetzen. flag: "bio"|"regional"|null.
// Fehlt die Kennzeichnung im ganzen Kreis, wird ehrlich der günstigste genommen
// und die Lücke gezählt (Entscheidung 8) statt still das Nächstbeste zu behaupten.
function wagerlPosten(v, flag){
  const mg = vorlageMenge(v.name);
  const ziel = wagerlZiel(mg);
  const alle = wagerlKandidaten(mg.rest);
  const posten = { id: v.id, begriff: mg.rest, menge: mg, produkt: null, luecke: null };
  if(!alle.length){ posten.luecke = "fehlt"; return posten; }
  let kreis = alle, markiert = true;
  if(flag){
    kreis = alle.filter(h => h[flag]);
    if(!kreis.length){ kreis = alle; markiert = false; }
  }
  const wahl = wagerlDeckung(kreis, ziel) || wagerlDeckung(alle, ziel);
  if(!wahl){ posten.luecke = "einheit"; return posten; }   // Menge passt zu keiner Packung
  posten.produkt = { name: wahl.h.name, unit: wahl.h.unit, n: wahl.n,
    preis: wahl.h.best.price, laden: wahl.h.best.store, kosten: wahl.kosten,
    cat: wahl.h.cat || null, ohneMenge: !ziel };
  if(flag && !markiert) posten.luecke = flag;
  return posten;
}

// Alle drei Wagerl auf einmal. Rechnet über die Läden des Datensatzes und weist
// die Aufteilung aus (Entscheidung 9); Wegkosten kommen aus dem Sparplan-Rahmen,
// sobald Zuhause und Läden gesetzt sind – hier zählt erst die ehrliche Grundlage.
function dreiWagerl(){
  const vorlage = visible(S.vorlage);
  const mach = (flag) => {
    const posten = vorlage.map(v => wagerlPosten(v, flag));
    let summe = 0, offen = 0, luecken = 0;
    const laeden = {};
    for(const p of posten){
      if(p.produkt){
        summe += p.produkt.kosten;
        laeden[p.produkt.laden] = (laeden[p.produkt.laden]||0) + 1;
        if(p.luecke) luecken++;
      } else offen++;
    }
    return { posten, summe, offen, luecken, laeden };
  };
  return { guenstig: mach(null), regional: mach("regional"), bio: mach("bio") };
}

// Die Vorlage: Oberbegriffe mit Menge ("3 l Milch"), aus denen Drei Wagerl die
// Einkaufsvarianten rechnet. Eine ganz normale mitsyncte Liste mit Grabsteinen.
async function updateVorlage(fn){
  await withLock(async () => {
    const cur = await readLocal("vorlage", []);
    const next = fn(cur);
    S.vorlage = next;
    await writeLocal("vorlage", next);
    render();
  });
  if(syncOn()) syncNow(true);
}
const isPlace = (r) => !!r && !r.virtual && r.type!=="allgemein";
async function addRoom(name, type, floor){
  const n = String(name||"").trim();
  if(!n) return null;
  if(visible(S.rooms).some(r => norm(r.name)===norm(n))) return null;  // Doppelte vermeiden
  const t = type||"allgemein";
  const room = { id:uid(), name:n, type:t, floor:floor||typeFloor(t), updatedAt:now() };
  if(t==="allgemein") room.virtual = true;
  await updateRooms(list => list.concat([room]));
  return room;
}
// Raum löschen: bestehende Aufgaben wandern nach Allgemein statt zu verschwinden
// Raum ändern – beim Umbenennen wandern die Aufgaben mit
async function editRoom(id, name, type, floor){
  const room = S.rooms.find(r => r.id===id); if(!room) return false;
  const n = String(name||"").trim() || room.name;
  if(visible(S.rooms).some(r => r.id!==id && norm(r.name)===norm(n))) return false;
  const oldName = room.name;
  await updateRooms(list => list.map(r => r.id===id
    ? Object.assign({}, r, { name:n, type:type||r.type, floor:floor||r.floor,
        virtual: (type||r.type)==="allgemein" ? true : false, updatedAt:now() })
    : r));
  if(n !== oldName){
    await updateItems("tasks", list => list.map(t => t.room===oldName
      ? Object.assign({}, t, {room:n, updatedAt:now()}) : t));
  }
  return true;
}
async function deleteRoom(id){
  const room = S.rooms.find(r => r.id===id);
  if(!room) return;
  await updateRooms(list => list.map(r => r.id===id ? Object.assign({},r,{deleted:true, updatedAt:now()}) : r));
  const moved = visible(S.tasks).filter(t => t.room===room.name).length;
  if(moved) await updateItems("tasks", list => list.map(t =>
    (t.room===room.name && !t.deleted) ? Object.assign({},t,{room:"Allgemein", updatedAt:now()}) : t));
  toast(moved ? room.name+" gelöscht, "+moved+" Aufgabe(n) nach Allgemein" : room.name+" gelöscht");
}
// Produkte aus einer Aufgabe übernehmen – mit bekanntem Preis und Laden
// Diesmal auslassen: schiebt die Fälligkeit weiter, ohne sie als erledigt zu werten
async function skipTask(id){
  let msg = "";
  await updateItems("tasks", list => list.map(t => {
    if(t.id!==id) return t;
    let next;
    if(t.repeat){
      next = addDays(t.due || today(), t.repeat);
      let guard = 0;
      while(dayDiff(next) < 0 && guard++ < 200) next = addDays(next, t.repeat);   // Rhythmus beibehalten
      msg = t.title+" – erst wieder am "+fmtDate(next);
    } else {
      const base = (t.due && dayDiff(t.due) >= 0) ? t.due : today();
      next = addDays(base, 7);
      msg = t.title+" – auf "+fmtDate(next)+" verschoben";
    }
    return Object.assign({}, t, { due: next, skips: (t.skips||0)+1, updatedAt: now() });
  }));
  if(msg) toast(msg);
}

async function addProductsToList(names){

             cat:katFuer(n), by:S.meId, done:false, at:today(), updatedAt:now() };

// Preisgedächtnis: je Artikel ein Eintrag pro Laden, damit sich der günstigste
// überhaupt bestimmen lässt. Alte Einträge (ein Preis pro Artikel) werden übernommen.
function normPriceEntry(e){
  if(!e) return null;
  if(e.byStore) return e;
  // lastName und buys mitnehmen – der Zweig hat sie früher verschluckt, und
  // noteBought baut sein e aus genau diesem Rückgabewert.
  const out = { byStore:{}, last:{price:e.price!=null?e.price:null, store:e.store||null, at:e.at||null},
    lastName: e.lastName || null, buys: Array.isArray(e.buys) ? e.buys : [],
    vergessenAt: e.vergessenAt || 0, wiederAt: e.wiederAt || 0, updatedAt: e.updatedAt||0 };
  if(e.price!=null && e.store) out.byStore[e.store] = { price:e.price, at:e.at||null };
  return out;
}
function priceInfo(name){ return normPriceEntry(S.prices[norm(name)]); }
// Günstigster bekannter Laden für einen Artikel
function bestPrice(name){
  const e = priceInfo(name);
  if(!e) return null;
  let best = null;
  for(const st in e.byStore){
    const p = e.byStore[st];
    if(p && p.price!=null && (!best || p.price < best.price)) best = { store:st, price:p.price, at:p.at };
  }
  if(!best && e.last && e.last.price!=null) best = { store:e.last.store, price:e.last.price, at:e.last.at };
  return best;
}
async function rememberPrice(name, price, store){
  if(price==null && !store) return;
  await withLock(async () => {
    const cur = await readLocal("prices", {});
    const key = norm(name);
    const e = normPriceEntry(cur[key]) || { byStore:{}, last:null, updatedAt:0 };
    if(price!=null && store) e.byStore[store] = { price, at:today() };
    e.last = { price:price!=null?price:null, store:store||null, at:today() };
    e.lastName = name;
    e.updatedAt = now();
    cur[key] = e;
    S.prices = cur;
    await writeLocal("prices", cur);
  });
  if(syncOn()) syncNow(true);
}

// Beim Abhaken merkt sich Zettl, wann etwas gekauft wurde – daraus entsteht
// der Rhythmus ("Milch alle 4 Tage").
async function noteBought(name){
  await withLock(async () => {
    const cur = await readLocal("prices", {});
    const key = norm(name);
    const e = normPriceEntry(cur[key]) || { byStore:{}, last:null, updatedAt:0 };
    e.buys = (e.buys||[]).filter(d => d !== today());
    e.buys.push(today());
    e.lastName = e.lastName || name;
    if(e.buys.length > 12) e.buys = e.buys.slice(-12);
    // Wer den Artikel wieder kauft, will ihn offenbar wieder im Verlauf haben.
    // Die Vergessen-Marke muss weg, sonst filtert sie den neuen Kauf gleich mit.
    // Das Löschen allein reicht aber nicht: beim Sync holt die Vereinigung die
    // Marke vom anderen Handy zurück. wiederAt hält dagegen und gewinnt, weil es
    // jünger ist – siehe mergePriceEntry().
    delete e.vergessenAt;
    e.wiederAt = now();
    e.updatedAt = now();
    cur[key] = e;
    S.prices = cur;
    await writeLocal("prices", cur);
  });
  if(syncOn()) syncNow(true);
}
// Aus dem Verlauf nehmen. Nötig, seit dort auch einmalig Gekauftes steht: was
// einmal auf dem Zettel war – ein Medikament, ein Geschenk – bliebe sonst 90 Tage
// lang für beide sichtbar. Die Marke bleibt liegen, damit die Vereinigung beim
// Sync die Kaufdaten nicht vom anderen Handy zurückholt.
async function vergessen(name){
  await withLock(async () => {
    const cur = await readLocal("prices", {});
    const key = norm(name);
    const e = normPriceEntry(cur[key]);
    if(!e) return;
    e.buys = [];
    e.vergessenAt = now();
    e.updatedAt = now();
    cur[key] = e;
    S.prices = cur;
    await writeLocal("prices", cur);
  });
  if(syncOn()) syncNow(true);
}
function daysBetween(a, b){ return Math.round((new Date(b+"T00:00:00") - new Date(a+"T00:00:00"))/86400000); }
// Zuletzt gekauft – die eine Vorschlagsliste. Früher gab es zwei: hier den Rhythmus
// ("Wieder fällig", mindestens zwei Käufe) und nichts für alles Seltenere. Jetzt steht
// alles Gekaufte drin, das Zuletzt zuerst, und der Rhythmus ist nur noch ein Vermerk.
// Was gerade auf die Liste wandert. Muss ausserhalb des DOM stehen: render() wirft
// die Knöpfe weg, ein disabled am Knopf überlebt das nicht – und dann legt der
// zweite Tipp denselben Artikel ein zweites Mal an.
const zuletztBusy = new Set();
function zuletztGekauft(){
  // Gegen ALLE Artikel filtern, die auf dem Zettel stehen – auch die abgehakten.
  // Sonst schlägt die Liste vor, was gerade eben im Wagerl gelandet ist.
  const drauf = visible(S.shopping).map(i => norm(i.name));
  const out = [];
  for(const key in S.prices){
    const e = normPriceEntry(S.prices[key]);
    // buys kommt per Sync herein und ist damit Fremddatum – nur Datumsstrings zählen
    const buys = (e && Array.isArray(e.buys)) ? e.buys.filter(d => typeof d === "string" && d) : [];
    if(!buys.length) continue;
    if(drauf.indexOf(key) >= 0 || zuletztBusy.has(key)) continue;
    const sorted = buys.slice().sort();
    const her = daysBetween(sorted[sorted.length-1], today());
    if(!Number.isFinite(her)) continue;       // kaputtes Datum: lieber gar nicht anzeigen
    // Rhythmus erst ab zwei Käufen – und ein Abstand von einem Tag ist keiner,
    // sonst gilt ein an zwei Folgetagen Gekauftes für immer als fällig.
    let schnitt = null;
    if(sorted.length >= 2){
      let sum = 0;
      for(let i=1;i<sorted.length;i++) sum += daysBetween(sorted[i-1], sorted[i]);
      if(Number.isFinite(sum)) schnitt = Math.max(1, Math.round(sum/(sorted.length-1)));
    }
    const faellig = schnitt != null && schnitt >= 2 && her >= Math.round(schnitt*0.8);
    // Fälliges bleibt stehen, auch wenn sein Rhythmus länger ist als das Fenster –
    // sonst verschwindet gerade das, woran man sich am schlechtesten erinnert.
    if(her > 90 && !faellig) continue;
    out.push({ key, name: e.lastName || key, her, schnitt, faellig,
               quote: schnitt ? her/schnitt : 0, at: e.updatedAt || 0 });
  }
  // Fälliges zuerst, darin das am längsten Überfällige. Sonst das Jüngste; buys kennt
  // nur den Tag, bei Gleichstand entscheidet der Zeitstempel des Eintrags.
  out.sort((a,b) => (b.faellig?1:0) - (a.faellig?1:0) || b.quote - a.quote
                 || a.her - b.her || b.at - a.at);
  return out.slice(0, 8);
}
function zuletztWann(z){
  if(z.faellig) return "fällig";
  if(z.her <= 0) return "heute";
  if(z.her === 1) return "gestern";
  return "vor " + z.her + " T.";
}

// Bewusst schlicht: keine Warengruppen-Köpfe, keine Ladennamen, kein Einklappen.

// ---------------------------------------------------- CO2-Schätzung
// Durchschnittswerte in kg CO2e pro kg Ware, aus Ökobilanz-Studien
// (Poore & Nemecek 2018 und Folgearbeiten). Bewusst grob: die Streuung
// zwischen einzelnen Höfen ist größer als der Unterschied vieler Zahlen hier.
const CO2 = [
  [/rind|beef|steak|faschiert|gulasch|leberkas/, 60, "Huhn oder Hülsenfrüchte", 6],
  [/lamm|schaf/, 24, "Huhn", 6],
  [/butter(?!milch)/, 12, "pflanzliche Margarine", 2],
  [/kase|parmes|gouda|emmental|cheddar|mozzarell|feta|camembert|brie/, 21, "Topfen oder Frischkäse", 5],
  [/schokolade|schoko|praline|nutella|kakao/, 19, "weniger oft, dafür bewusster", 19],
  [/kaffee|espresso|kapsel/, 17, "Tee", 2],
  [/schwein|speck|schinken|wurst|salami|bratwurst|wurstel|kotelett|selchfleisch/, 7, "Huhn oder Hülsenfrüchte", 3],
  [/huhn|huhner|hendl|pute|truthahn|geflugel|chicken/, 6, "Hülsenfrüchte oder Tofu", 1.5],
  [/obers|sahne|rahm/, 6, "Hafer- oder Sojaalternative", 1.5],
  [/lachs|garnele|shrimp|thunfisch|fisch|forelle|zander|karpfen/, 5, "heimischer Fisch oder Hülsenfrüchte", 3],
  [/(^|\s)ei(er)?($|\s|,)/, 4.5, "pflanzliche Alternative", 1.5],
  [/reis(?!wa)/, 4, "Nudeln oder Erdäpfel", 1],
  [/olivenol|rapsol|sonnenblumenol|speiseol|(^|\s)ol($|\s)/, 3.5, "", 0],
  [/zucker/, 3, "", 0],
  [/tofu|soja/, 3, "", 0],
  [/hafermilch|haferdrink|sojamilch|sojadrink|mandelmilch|reismilch|pflanzendrink|hafer drink/, 0.9, "", 0],
  [/milch(?!schnitte)/, 3, "Hafermilch", 0.9],
  [/joghurt|jogurt|topfen|quark|skyr/, 2.5, "", 0],
  [/nusse|mandel|cashew|erdnuss|walnuss|hasselnuss|haselnuss/, 2.3, "", 0],
  [/tomat|paradeiser/, 2.1, "heimische, wenn Saison ist", 0.6],
  [/papier|tuch|windel|reiniger|waschmittel|spulmittel|shampoo|zahnpasta|creme|deo|seife/, 2.0, "", 0],
  [/wein|sekt|prosecco/, 1.8, "", 0],
  [/nudel|pasta|spaghetti|penne|couscous|mehl|griess|polenta/, 1.6, "", 0],
  [/brot|semmel|weckerl|geback|kipferl|toast|croissant|striezel/, 1.3, "", 0],
  [/bier|radler/, 1.1, "", 0],
  [/obst|apfel|banan|birne|orange|traub|beere|melone|kiwi|mango|zitrone|marille|pfirsich/, 0.9, "", 0],
  [/linsen|bohnen|kichererbsen|erbsen|hulsenfruchte/, 0.9, "", 0],
  [/kartoffel|erdapfel|gemuse|karotte|zwiebel|salat|gurke|kraut|kohl|kurbis|paprika|zucchini|brokkoli|spinat/, 0.5, "", 0],
  [/wasser|mineral|soda/, 0.3, "Leitungswasser", 0.05]
];
// Standardgewichte, wenn nur "1 stk" bekannt ist
const STK_GEWICHT = { backwaren:0.08, obst:0.2, kuehl:0.3, fleisch:0.3, tiefkuehl:0.4,
  getraenke:1.0, vorrat:0.5, suess:0.15, haushalt:0.4, drogerie:0.3, tierbedarf:0.5, sonst:0.3 };

// Wieviel Kilo steckt in "250 g", "1,5 l", "2 stk"?
function kiloAus(unit, cat){
  if(!unit) return null;
  const m = String(unit).replace(",", ".").match(/^\s*([0-9]+(?:\.[0-9]+)?)\s*([a-zäöü]+)/i);
  if(!m) return null;
  const z = parseFloat(m[1]), e = m[2].toLowerCase();
  if(e === "kg" || e === "l") return z;
  if(e === "g" || e === "ml") return z/1000;
  if(e.indexOf("stk") === 0 || e.indexOf("st") === 0 || e.indexOf("pack") === 0)
    return z * (STK_GEWICHT[cat] || 0.3);
  return null;
}
// Umlaute weg vor dem Vergleich – sonst findet "huhn" die "Hühnerbrust" nicht.
// norm() faltet inzwischen auf "hue", hier wird daraus der nackte Vokal.
const ohneUmlaut = (s) => norm(s).replace(/ae/g,"a").replace(/oe/g,"o").replace(/ue/g,"u");
// Preis pro Kilo, Liter oder Stück – die einzige Zahl, die Packungen vergleichbar macht
function grundpreis(preis, einheit){
  if(preis == null || !einheit) return null;
  const m = String(einheit).replace(",", ".").match(/^\s*([0-9]+(?:\.[0-9]+)?)\s*([a-zäöü]+)/i);
  if(!m) return null;
  const z = parseFloat(m[1]), e = m[2].toLowerCase();
  if(!(z > 0)) return null;
  if(e === "kg") return { wert: preis/z, je: "kg" };
  if(e === "g")  return { wert: preis/(z/1000), je: "kg" };
  if(e === "l")  return { wert: preis/z, je: "l" };
  if(e === "ml") return { wert: preis/(z/1000), je: "l" };
  if(e.indexOf("stk") === 0 || e.indexOf("st") === 0) return { wert: preis/z, je: "Stk" };
  return null;
}
function grundpreisText(preis, einheit){
  const g = grundpreis(preis, einheit);
  if(!g) return "";
  const wert = g.wert >= 100 ? Math.round(g.wert) : Math.round(g.wert*100)/100;
  return String(wert).replace(".", ",") + " €/" + g.je;
}

function co2Faktor(name){
  const n = ohneUmlaut(name);
  for(const [re, f, alt, altF] of CO2) if(re.test(n)) return { f, alt, altF };
  return null;
}
// Schätzung für einen Artikel: { kg, faktor, alt, ersparnis }
function co2Fuer(item){
  const treffer = co2Faktor(item.name);
  if(!treffer) return null;
  const kilo = kiloAus(item.unit || itemMenge(item), item.cat || guessCat(item.name));
  const menge = kilo != null ? kilo : (STK_GEWICHT[item.cat || guessCat(item.name)] || 0.3);
  const kg = treffer.f * menge;
  return { kg, alt: treffer.alt, ersparnis: treffer.alt ? (treffer.f - treffer.altF) * menge : 0 };
}
// Größenangabe steckt bei übernommenen Artikeln in Klammern im Namen
// "Bio Bergkäse (400 g)" -> "Bio Bergkäse". Mit der Größe im Suchbegriff
// findet man sonst nichts, weil jedes Wort vorkommen müsste.
const nameOhneGroesse = (s) => String(s || "").replace(/\s*\([^)]{1,16}\)\s*$/, "").trim();

function itemMenge(item){
  const m = String(item.name || "").match(/\(([^)]{1,14})\)\s*$/);
  return m ? m[1] : null;
}
function co2Bilanz(){
  const offen = visible(S.shopping).filter(i => !i.done);
  let summe = 0, gezaehlt = 0;
  const posten = [];
  offen.forEach(i => {
    const c = co2Fuer(i);
    if(!c) return;
    summe += c.kg; gezaehlt++;
    posten.push({ name: i.name, kg: c.kg, alt: c.alt, ersparnis: c.ersparnis });
  });
  posten.sort((a, b) => b.kg - a.kg);
  return { summe, gezaehlt, gesamt: offen.length, posten };
}
const kgCo2 = (v) => (v >= 10 ? Math.round(v) : Math.round(v*10)/10).toString().replace(".", ",") + " kg";

// Vergleichbare Artikel finden – sortiert nach Preis pro Kilo, denn nur der
// macht 250-g-Packung und 1-kg-Sack vergleichbar.
let altGesamt = 0;      // wie viele es insgesamt waren, für die Überschrift
function alternativen(item){
  if(!pdIndex || !pdIndex.length) return [];
  const rein = nameOhneGroesse(item.name);
  const eigenName = norm(rein);
  const eigen = grundpreis(item.price, item.size || itemMenge(item));
  let roh = pdSuche(rein, 15);
  // Bei wenigen Treffern breiter suchen: das Hauptwort genügt, sonst findet
  // "Bio Bergkäse" nur sich selbst und keinen anderen Bergkäse.
  if(roh.length < 3){
    const worte = norm(rein).split(" ").filter(w => w.length > 3);
    const kopf = worte[worte.length-1] || worte[0];
    if(kopf && kopf !== norm(rein)) roh = pdSuche(kopf, 15);
  }
  const liste = [];
  roh.forEach(h => {
    if(norm(h.name) === eigenName) return;   // gleicher Name ist keine Alternative
    const g = grundpreis(h.best.price, h.unit);
    // Nur vergleichen, was dieselbe Einheit hat. Sonst stehen Waffeln und
    // Butterkekse als Alternative zu einem Liter Milch da, weil ihr €/kg
    // kleiner ist als der €/l der Milch.
    if(eigen && (!g || g.je !== eigen.je)) return;
    liste.push({
      h, gp: g ? g.wert : null, je: g ? g.je : null,
      spart: (eigen && g && eigen.je === g.je) ? eigen.wert - g.wert : null
    });
  });
  altGesamt = liste.length;
  // Erst nach Relevanz kürzen, DANN nach Kilopreis sortieren. Vorher lief die
  // Preissortierung über den ganzen Rohtopf – deshalb stand bei "Handseife
  // Lavendel" der Allzweckreiniger auf Platz 1: billig, aber keine Seife.
  const eng = liste.slice(0, 10);
  eng.sort((a, b) => {
    if(a.gp != null && b.gp != null) return a.gp - b.gp;
    if(a.gp != null) return -1;
    if(b.gp != null) return 1;
    return a.h.best.price - b.h.best.price;
  });
  return eng.slice(0, 8);
}

// Genau dieses Produkt in den Händlerdaten – nützlich, solange der Artikel
// noch keinen Preis hat.
function passendesProdukt(item){
  if(item.price != null) return null;
  if(!pdIndex || !pdIndex.length) return null;
  const n = norm(nameOhneGroesse(item.name));
  const treffer = pdIndex.filter(e => e.n === n && e.prices.length);
  if(!treffer.length) return null;
  treffer.sort((a, b) => a.prices[0].price - b.prices[0].price);
  const e = treffer[0];
  return { name:e.name, unit:e.unit, cat:e.cat, bio:e.bio, regional:e.regional,
           offer:e.offer, best:e.prices[0], prices:e.prices };
}

// ---------------------------------------------------- Sparplan
// Für jeden Artikel den günstigsten bekannten Kauf suchen: aus der Preisdatei
// und aus dem eigenen Preisgedächtnis. Daraus den optimalen Einkauf bauen.
function sparPlan(){
  const offen = visible(S.shopping).filter(i => !i.done);
  const zeilen = offen.map(i => {
    const jetzt = (i.price != null) ? { price:i.price, store:i.store||null } : null;
    const eigeneMenge = i.size || itemMenge(i);
    const eigenGp = grundpreis(i.price, eigeneMenge);      // was ihr jetzt pro kg/l zahlt
    let besser = null, alle = [];
    // Vergleichbares suchen, nicht nur den bestplatzierten Treffer: Die Marke ist
    // egal, ein halber Liter Milch darf gegen einen günstigeren Liter getauscht
    // werden. Erst nach Relevanz kürzen, dann nach Grundpreis – sonst gilt das
    // Billigste als Alternative, auch wenn es etwas ganz anderes ist.
    const roh = (pdIndex && pdIndex.length) ? pdSuche(nameOhneGroesse(i.name), 12) : [];
    if(roh.length){
      const kand = [];
      roh.slice(0, 8).forEach(h => {
        if(!h.best || h.best.price == null) return;
        const g = grundpreis(h.best.price, h.unit);
        // Nur vergleichen, was dieselbe Einheit hat. Euro je Liter gegen Euro je
        // Kilo zu stellen ergäbe Unsinn – dann wäre Käse eine billige Milch.
        if(eigenGp && (!g || g.je !== eigenGp.je)) return;
        kand.push({ h, gp: g ? g.wert : null });
      });
      // Ohne eigenen Grundpreis bleibt es beim relevantesten Treffer
      const wahl = eigenGp ? kand.filter(k => k.gp != null).sort((a,b) => a.gp - b.gp)[0]
                           : { h: roh[0], gp: null };
      if(wahl){
        const h = wahl.h;
        alle = h.prices.slice();
        besser = { name:h.name, unit:h.unit, price:h.best.price, store:h.best.store,
                   bio:h.bio, regional:h.regional, gp:wahl.gp, je:eigenGp ? eigenGp.je : null,
                   verliertBio: !!(i.bio && !h.bio), verliertRegional: !!(i.regional && !h.regional) };
      }
    }
    // Eigenes Gedächtnis kann günstiger sein
    const mem = bestPrice(i.name);
    if(mem && mem.price != null && (!besser || mem.price < besser.price)){
      besser = { name:i.name, unit:eigeneMenge, price:mem.price, store:mem.store };
      alle = [{ store:mem.store, price:mem.price }];
    }
    // Ersparnis auf EURE Menge umgerechnet, nicht der Packungsunterschied –
    // "1 kg statt 250 g spart 2 €" wäre sonst schlicht falsch.
    let spart = 0;
    if(jetzt && besser){
      if(eigenGp && besser.gp != null){
        const menge = jetzt.price / eigenGp.wert;            // in kg, l oder Stück
        spart = (eigenGp.wert - besser.gp) * menge;
      } else if(besser.price < jetzt.price){
        spart = jetzt.price - besser.price;
      }
      if(!(spart > 0.01)) spart = 0;
    }
    return { item:i, jetzt, besser, alle, spart };
  });

  const mitPreis = zeilen.filter(z => z.besser);
  const summeOptimal = mitPreis.reduce((a, z) => a + z.besser.price, 0);
  const summeJetzt = zeilen.filter(z => z.jetzt).reduce((a, z) => a + z.jetzt.price, 0);
  const ersparnis = zeilen.reduce((a, z) => a + z.spart, 0);

  // Aufteilung auf die Läden
  const proLaden = {};
  mitPreis.forEach(z => {
    const s = z.besser.store || "ohne Laden";
    proLaden[s] = proLaden[s] || { summe:0, anzahl:0 };
    proLaden[s].summe += z.besser.price; proLaden[s].anzahl++;
  });
  const laeden = Object.keys(proLaden).sort((a,b) => proLaden[b].summe - proLaden[a].summe);

  // Alternative: alles in einem einzigen Laden
  const einzeln = [];
  const kandidaten = new Set();
  mitPreis.forEach(z => z.alle.forEach(p => kandidaten.add(p.store)));
  kandidaten.forEach(st => {
    let summe = 0, bekannt = 0;
    mitPreis.forEach(z => {
      const da = z.alle.find(p => p.store === st);
      if(da){ summe += da.price; bekannt++; }
      else summe += z.besser.price;      // was es dort nicht gibt, zum besten Preis geschätzt
    });
    if(bekannt >= Math.max(1, Math.floor(mitPreis.length * 0.6))) einzeln.push({ store:st, summe, bekannt });
  });
  einzeln.sort((a,b) => a.summe - b.summe);

  // Was kostet der Umweg?
  const km = laeden.length > 1
    ? laeden.slice(1).map(n => { const sh = shopByName(n); return sh && sh.dist != null ? sh.dist*2 : null; })
        .filter(d => d != null).reduce((a,b) => a+b, 0) || null
    : null;
  const sprit = km != null ? fahrtKosten(km) : null;

  return { zeilen, mitPreis, summeOptimal, summeJetzt, ersparnis, proLaden, laeden, einzeln, km, sprit };
}

// Lohnt sich der zweite Laden? Vergleicht "alles in einem" mit "je dort, wo es
// am günstigsten ist" und rechnet die Fahrt dagegen.
function carSettings(){
  const c = (S.shops && S.shops.car) || {};
  return { verbrauch: c.verbrauch!=null ? c.verbrauch : 7, preis: c.preis!=null ? c.preis : 1.75 };
}
function fahrtKosten(km){
  const c = carSettings();
  return km * (c.verbrauch/100) * c.preis;
}
function routeAnalysis(){
  const offen = visible(S.shopping).filter(i => !i.done);
  if(!offen.length) return null;
  const laeden = activeStores();
  const preisIn = (i, st) => {
    const e = priceInfo(i.name);
    if(e && e.byStore[st] && e.byStore[st].price!=null) return e.byStore[st].price;
    if(i.price!=null && i.store===st) return i.price;
    return null;
  };
  // Bester Mix: jeder Artikel dort, wo er am günstigsten bekannt ist
  let mix = 0, mixLaeden = {};
  offen.forEach(i => {
    const b = (i.price!=null && i.store) ? {price:i.price, store:i.store} : bestPrice(i.name);
    if(b && b.price!=null){ mix += b.price; if(b.store) mixLaeden[b.store] = (mixLaeden[b.store]||0)+b.price; }
  });
  // Alles in einem Laden (fehlende Preise mit dem bekannten Bestpreis geschätzt)
  const einzeln = [];
  laeden.forEach(st => {
    let sum = 0, bekannt = 0, geschaetzt = 0;
    offen.forEach(i => {
      const p = preisIn(i, st);
      if(p!=null){ sum += p; bekannt++; return; }
      const b = bestPrice(i.name);
      if(b && b.price!=null){ sum += b.price; geschaetzt++; }
    });
    if(bekannt) einzeln.push({ store:st, sum, bekannt, geschaetzt });
  });
  einzeln.sort((a,b) => a.sum - b.sum);
  const besterEinzel = einzeln[0] || null;
  const mixNamen = Object.keys(mixLaeden);
  if(!besterEinzel || mixNamen.length < 2) return { mix, mixLaeden, einzeln, besterEinzel, lohnt:null };

  const ersparnis = besterEinzel.sum - mix;
  // Umweg: der zusätzliche Laden, gerechnet als Hin- und Rückweg
  const extra = mixNamen.filter(n => n !== besterEinzel.store)
    .map(n => { const sh = shopByName(n); return sh && sh.dist!=null ? sh.dist : null; })
    .filter(d => d!=null);
  const km = extra.length ? extra.reduce((a,b)=>a+b,0)*2 : null;
  const sprit = km!=null ? fahrtKosten(km) : null;
  return { mix, mixLaeden, einzeln, besterEinzel, ersparnis, km, sprit,
           lohnt: (sprit!=null && ersparnis!=null) ? (ersparnis - sprit) : null };
}

// Was kostet der offene Einkauf – gesamt und je Laden?
function basketAnalysis(){
  const open = visible(S.shopping).filter(i=>!i.done);
  const perStore = {}; let known=0, unknown=0, sum=0;
  const cheapest = {};   // Laden -> Summe, wenn man jeden Artikel dort kauft, wo er am billigsten ist
  open.forEach(i => {
    const b = (i.price!=null) ? {store:i.store||null, price:i.price} : bestPrice(i.name);
    const mal = i.anzahl || 1;              // Drei Wagerl: n Packungen derselben Ware
    if(b && b.price!=null){
      known++; sum += b.price*mal;
      const st = b.store || "ohne Laden";
      perStore[st] = (perStore[st]||0) + b.price*mal;
      cheapest[st] = (cheapest[st]||0) + b.price*mal;
    } else unknown++;
  });
  const stores = Object.keys(perStore).sort((a,b)=>perStore[b]-perStore[a]);
  return { count:open.length, known, unknown, sum, perStore, stores };
}

// -------------------------------------------------- Einladung (Link)
// Der Link enthält nur Adresse + öffentlichen Schlüssel der Datenbank.
// Die Listen selbst bleiben verschlüsselt – ohne Haus-Passwort geht nichts.
function b64url(s){ return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function unb64url(s){
  const t = s.replace(/-/g,"+").replace(/_/g,"/");
  return decodeURIComponent(escape(atob(t + "===".slice((t.length+3)%4))));
}
function inviteLink(){
  const c = syncCfg(); if(!c) return null;
  return location.origin + location.pathname + "#zettl=" + b64url(JSON.stringify({u:c.url, k:c.key}));
}
async function copyInvite(){
  const link = inviteLink(); if(!link) return false;
  try{ await navigator.clipboard.writeText(link); return true; }catch(e){ return false; }
}
// Beim Start: Zugang aus dem Link übernehmen und die Adresse wieder sauber machen
function applyInviteLink(){
  const m = String(location.hash||"").match(/#zettl=([A-Za-z0-9\-_]+)/);
  if(!m) return false;
  try{
    const cfg = JSON.parse(unb64url(m[1]));
    if(cfg && cfg.u && cfg.k){
      lsSet(LS.sync, {url:apiBase(cfg.u), key:cfg.k});
      S.sync = syncCfg();
      try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){ location.hash=""; }
      return true;
    }
  }catch(e){}
  return false;
}

// ------------------------------------------------------------------- Boot
async function boot(){
  S.sync = syncCfg();
  S.sortByStore = lsGet("zettl.sort", true);
  S.pref = Object.assign({ bio:false, regional:false, co2:true }, lsGet("zettl.pref", {}));
  S.zu = lsGet("zettl.zu", {});
  // Früher stand der Raumname im Aufklapp-Schlüssel ("r:Omas Zimmer") und lag
  // damit im Klartext im Speicher. Einmal wegräumen; der Zustand baut sich neu
  // auf, die neuen Schlüssel heißen "rid:" beziehungsweise "rn:".
  if(Object.keys(S.zu).some(k => k.indexOf("r:")===0)){
    const sauber = {};

  const fromLink = applyInviteLink();
  const vault = lsGet(LS.vault, null);

    if(syncOn()){

        const rv = await remoteGet("vault");
        if(rv){ lsSet(LS.vault, rv); S.vault=rv; e2eJemals=true; S.phase="unlock"; render(); return; }
      }catch(e){

}
// Das Kaufgedächtnis ist nach norm(name) verschlüsselt abgelegt. Seit norm()
// Umlaute faltet, liegen ältere Einträge unter dem alten Schlüssel und wären
// unauffindbar – "erdäpfel" statt "erdaepfel". Läuft bei jedem Start und ist
// mehrfach anwendbar: schreibt ein Handy im Funkloch noch mit der alten Fassung,
// wird das beim nächsten Start wieder eingesammelt. Eine Versionsmarkierung
// braucht es dafür nicht, und es gibt auch keine.
async function migriereSchluessel(){
  const cur = S.prices || {};
  let noetig = false;
  for(const k in cur){ if(norm(k) !== k){ noetig = true; break; } }
  if(!noetig) return;
  const neu = {};
  for(const k in cur){
    const nk = norm(k);
    neu[nk] = neu[nk] ? mergePriceEntry(neu[nk], cur[k]) : cur[k];
  }
  S.prices = neu;
  await writeLocal("prices", neu);
  if(syncOn()) syncNow(true);
}

             || (r.type==="allgemein" && !r.virtual))){

    const fixed = S.rooms.map(r => (r.floor && !LEGACY_TYPE[r.type] && !LEGACY_FLOOR[r.floor]
        && !(r.type==="allgemein" && !r.virtual)) ? r
      : Object.assign({}, r, {type:fixType(r.type), floor:fixFloor(r.floor)||typeFloor(r.type),
          virtual: r.virtual || fixType(r.type)==="allgemein", updatedAt:now()}));
    S.rooms = fixed;

// Räume ohne Position bekommen automatisch einen Platz im Raster
function layoutFloor(floor){
  const rooms = visible(S.rooms).filter(r => roomFloor(r)===floor && isPlace(r)).map(r => Object.assign({}, r));
  const offen = rooms.filter(r => r.x==null).length;
  if(!offen) return rooms;
  // Rasterweite an die Anzahl anpassen, damit auch zwölf Räume noch hineinpassen
  const n = rooms.length;
  const cols = Math.max(2, Math.ceil(Math.sqrt(n)));
  const rows = Math.max(2, Math.ceil(n/cols));
  const cw = (GRID-1)/cols, ch = (GRID-1)/rows;
  let i = rooms.filter(r => r.x!=null).length;
  rooms.forEach(r => {
    if(r.x!=null) return;
    const col = i % cols, row = Math.floor(i/cols);
    r.w = Math.max(3, cw-0.5); r.h = Math.max(2.5, ch-0.5);
    r.x = Math.min(GRID-r.w, 0.5 + col*cw);
    r.y = Math.min(GRID-r.h, 0.5 + row*ch);
    i++;
  });
  return rooms;
}

// Bild verkleinern, damit die Skizze nicht megabyteweise mitsynct
function shrinkImage(file, cb){
  const fr = new FileReader();
  fr.onload = () => {
    const raw = fr.result;
    try{
      const img = new Image();
      img.onload = () => {
        try{
          const max = 1400;
          const sc = Math.min(1, max/Math.max(img.width, img.height));
          const c = document.createElement("canvas");
          c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc);
          c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
          cb(c.toDataURL("image/jpeg", 0.72));
        }catch(e){ cb(raw); }
      };
      img.onerror = () => cb(raw);
      img.src = raw;
    }catch(e){ cb(raw); }
  };
  fr.onerror = () => cb(null);
  try{ fr.readAsDataURL(file); }catch(e){ cb(null); }   // z. B. beschädigte Auswahl
}

const R_EARTH = 6371;
function distKm(a, b){
  if(!a || !b) return null;
  const rad = (d) => d*Math.PI/180;
  const dLat = rad(b.lat-a.lat), dLon = rad(b.lon-a.lon);
  const s = Math.sin(dLat/2)**2 + Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLon/2)**2;
  return Math.round(2*R_EARTH*Math.asin(Math.sqrt(s))*10)/10;
}
